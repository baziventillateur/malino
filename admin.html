<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Malino · Admin</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--v:#7B5CFF;--vd:#5A3BE0;--ink:#24263A;--ink2:#5B5E78;--mut:#9094AE;--bg:#F4F1FF;--g:#16A34A;--r:#E03A45;--y:#B98200}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;box-shadow:0 1px 0 #E3DEF8}
header img{width:28px;height:28px;border-radius:8px}header h1{font-size:16px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:10px}
button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:6px 10px;background:var(--v);color:#fff;font-weight:600}
button.o{background:#EEE9FF;color:var(--vd)}button.r{background:#FFE4E6;color:var(--r)}button:disabled{opacity:.5}
input,select{border:1px solid #D9D3F3;border-radius:9px;padding:6px 8px;background:#fff;min-width:0}
.card{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 10px;box-shadow:0 1px 3px rgba(40,20,120,.06)}
.card h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 1px 3px rgba(40,20,120,.06)}.kpi b{display:block;font-size:20px}.kpi small{color:var(--ink2);font-size:12px}
.kpi.hl{background:linear-gradient(135deg,#7B5CFF,#A27BFF);color:#fff}.kpi.hl small{color:#EDE6FF}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:4px 6px;border-bottom:1px solid #EEE}
td{padding:6px;border-bottom:1px solid #F3F1FA;vertical-align:top}tr:last-child td{border-bottom:0}
.tag{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-plus{background:#EFE4FF;color:#5A22C8}.t-essai{background:#FFF3C9;color:#7A5200}.t-gratuit{background:#EEF0F5;color:#5B5E78}.t-echec,.t-rembourse{background:#FFE4E6;color:var(--r)}.t-paye{background:#DCFCE7;color:var(--g)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row input[type=email]{flex:1;min-width:180px}
.mut{color:var(--mut)}.small{font-size:12px}.scroll{overflow-x:auto}
.alert{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #F3F1FA;font-size:13px}.alert:last-child{border-bottom:0}
.fam{padding:8px 0;border-bottom:1px solid #F3F1FA}.fam:last-child{border-bottom:0}
.kids{display:flex;flex-wrap:wrap;gap:4px}.kid{background:#F4F1FF;border-radius:8px;padding:1px 6px;font-size:12px}
#login{max-width:360px;margin:40px auto;text-align:center}#login input{width:100%;margin:8px 0;padding:10px;font-size:16px}#login button{width:100%;padding:10px}
.msg{min-height:18px;color:var(--r);font-weight:600;font-size:13px}.msg.ok{color:var(--g)}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.hidden{display:none}
.lk{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);font-weight:500;margin:5px 0;padding:7px 9px;word-break:break-all}.lk b{color:var(--v)}
.sw{width:38px;height:22px;border-radius:99px;background:#D5D8E3;padding:0;position:relative}.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--g)}.sw.on::after{left:18px}
.fam[data-fiche]{cursor:pointer}.fam[data-fiche]:active{background:#FAF8FF}.go{color:var(--v);font-weight:800}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}.chip{background:#F4F1FF;color:var(--ink2);font-weight:600;font-size:12.5px;padding:4px 9px;border-radius:99px}.chip.on{background:var(--v);color:#fff}.chip b{font-weight:800;margin-left:2px}
.t-chaud{background:#FFE4D1;color:#B4440B}
#fiche{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}#fiche .fbar{position:sticky;top:0;z-index:2;background:#fff;padding:8px 12px;box-shadow:0 1px 0 #E3DEF8}
.pred h2{flex-wrap:wrap}.pred h2 b{font-size:20px}.gauge{height:8px;border-radius:99px;background:#EEF0F5;overflow:hidden;margin:2px 0 8px}.gauge i{display:block;height:100%;border-radius:99px}
.why{margin:0 0 6px;padding-left:18px;font-size:13px;color:var(--ink2)}.why li{margin:1px 0}.todo{margin:6px 0 8px;font-weight:600;font-size:13.5px;background:#F4F1FF;border-radius:10px;padding:7px 9px}
.btnl{display:inline-block;background:var(--v);color:#fff;font-weight:600;border-radius:9px;padding:6px 10px;text-decoration:none}
.kpis.k6{grid-template-columns:repeat(3,1fr)}.kpis.k4{grid-template-columns:repeat(4,1fr);gap:6px}.kpis.k4 .kpi{padding:6px 8px}.kpis.k4 .kpi b{font-size:17px}.kpis.k4 small{font-size:11px}.kpis.k6 .kpi b{font-size:17px}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;padding:2px 0;border-bottom:1px solid #E6E3F2}.bc{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:3px}.bc.acc{background:#F6F2FF}.bc i{display:block;width:100%;background:var(--v);border-radius:3px 3px 0 0}
.barax{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}.sw-acc{display:inline-block;width:10px;height:10px;border-radius:3px;background:#F6F2FF;border:1px solid #E3DAFF;vertical-align:-1px}
.bell{position:relative;padding:6px 9px}.bell b:not(:empty){position:absolute;top:-5px;right:-5px;min-width:17px;padding:0 4px;border-radius:99px;background:#FF4D4F;color:#fff;font-size:10.5px;line-height:17px;font-weight:800}
.nday{font-size:12px;font-weight:700;color:var(--mut);margin:10px 2px 4px;text-transform:uppercase;letter-spacing:.03em}.nit{display:flex;gap:9px;align-items:flex-start;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:5px;box-shadow:0 1px 2px rgba(40,20,120,.05);cursor:pointer}.nit.new{background:#F6F2FF;box-shadow:inset 3px 0 0 var(--v)}.nit .ic{font-size:19px;line-height:22px}.nit .tx{flex:1;min-width:0}.nit b{display:block;font-size:13.5px}.nit span{display:block;font-size:12.5px;color:var(--ink2);word-break:break-word}.nit small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.tabs{position:sticky;top:44px;z-index:4;display:flex;gap:6px;padding:6px 12px;background:var(--bg);max-width:980px;margin:0 auto}.tabs button{background:#fff;color:var(--ink2);font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;box-shadow:0 1px 2px rgba(40,20,120,.08)}.tabs button.on{background:var(--v);color:#fff}.tabs b:not(:empty){display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:99px;background:#FF5C5C;color:#fff;font-size:11px;line-height:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF5C5C;margin-right:4px;vertical-align:1px}.lnk{display:flex;gap:5px;margin:6px 0}.lnk input{flex:1;font-size:12.5px;color:var(--ink2)}.dem{border:1px solid #EEE9FF;border-radius:12px;padding:8px 10px;margin:0 0 8px}.dem.off{opacity:.7}
.dem .lnk{display:flex;gap:5px;margin:6px 0}.dem .lnk input{flex:1;font-size:12.5px;color:var(--ink2)}
.pers{border-top:1px solid #F3F1FA;padding:6px 0}.pers>.row{cursor:pointer}.pers .its{margin:6px 0 2px;padding-left:4px}
.it{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;flex-wrap:wrap}.it .ar{font-size:18px;min-width:70px;text-align:right;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif}.it .s{color:var(--mut);flex:1;min-width:80px}.it audio{height:28px;width:150px}.dl{text-decoration:none;font-size:15px;padding:0 2px}.it button{padding:4px 8px}
textarea{font:inherit;border:1px solid #D9D3F3;border-radius:9px;padding:6px 8px;width:100%}
</style>
</head>
<body>
<header><img src="logo.svg" alt=""><h1>Malino · Admin</h1><button class="o bell" id="bell" title="Notifications">🔔<b id="bellN"></b></button><button class="o" id="refresh" title="Actualiser">↻</button><a href="./" style="font-size:13px;color:var(--vd);font-weight:600;text-decoration:none">Appli</a></header>
<nav id="tabs" class="tabs hidden"><button data-view="tableau">📊 Tableau de bord</button><button data-view="contrib">🤝 Contributions <b id="tabN"></b></button></nav>
<main id="app"><p class="mut">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://fcfkfuqzgsmckkxqfwuo.supabase.co',SB_KEY='sb_publishable_a3SNrQOSCH20T5sKsJxuAA_s7H4yCSR',API=SB_URL+'/functions/v1/malino-api';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=c=>(c/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const d=x=>x?new Date(x).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
const dh=x=>x?new Date(x).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ago=x=>{if(!x)return '—';const m=(Date.now()-Date.parse(x))/6e4;return m<60?Math.round(m)+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' j';};
const lvl=xp=>{let L=1,r=xp||0;while(r>=80+40*L){r-=80+40*L;L++;}return L;};
const jours=x=>Math.max(0,Math.ceil((Date.parse(x)-Date.now())/864e5));
let D=null,email='',q='',VIEW=/^#(contrib|dev)$/.test(location.hash)?'contrib':'tableau';

function loginView(step,msg){
  app.innerHTML=`<div id="login" class="card"><img src="logo.svg" width="56" height="56" style="border-radius:14px"><h2 style="justify-content:center">Connexion admin</h2>
  ${step==='code'?`<p class="small mut">Code envoyé à <b>${esc(email)}</b></p><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu par e-mail" maxlength="10"><button id="go">Valider</button>`
  :`<input id="mail" type="email" placeholder="ton e-mail admin" value="${esc(email)}" autocomplete="email"><button id="go">Recevoir un code</button>`}
  <p class="msg" id="msg">${esc(msg||'')}</p></div>`;
  $('#go').onclick=async()=>{
    if(step!=='code'){email=$('#mail').value.trim().toLowerCase();$('#msg').textContent='Envoi…';
      const r=await fetch(SB_URL+'/functions/v1/code-connexion',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({email})}).then(r=>r.json()).catch(()=>({}));
      if(r.ok||r.error==='trop_vite')return loginView('code',r.ok?'':'Un code vient déjà d’être envoyé');return $('#msg').textContent='Envoi impossible';}
    const code=$('#code').value.replace(/\D/g,'');let r={error:1};
    for(const t of ['email','magiclink','signup']){r=await sb.auth.verifyOtp({email,token:code,type:t});if(!r.error)break;}
    if(r.error)return $('#msg').textContent='Code incorrect ou expiré';load();
  };
}

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginView('mail');
  app.innerHTML='<p class="mut">Chargement…</p>';
  const {data,error}=await sb.rpc('admin_tableau');
  if(error){app.innerHTML=`<div class="card"><h2>Accès refusé</h2><p>Le compte <b>${esc(session.user.email)}</b> n’est pas administrateur.</p><button id="out" class="o">Changer de compte</button></div>`;$('#out').onclick=async()=>{await sb.auth.signOut({scope:'local'});loginView('mail');};return;}
  D=data;$('#tabs').classList.remove('hidden');render();loadDev();bellCount();if(!load.t)load.t=setInterval(bellCount,60000);
  if(location.hash==='#notifs'&&!load.nb){load.nb=1;openBell();}
}

// ---------- Cloche : notifications importantes (journal) et push sur le téléphone ----------
const NTYPE={inscription:['👋','Nouveau compte'],contrib_debut:['🎙️','Contribution commencée'],contrib_fin:['✅','Contribution terminée'],code_utilise:['🎟️','Code promo utilisé'],code_refuse:['🚫','Code promo refusé'],cadeau_achete:['🎁','Cadeau Malino+ acheté'],cadeau_sans_formulaire:['🎁','Cadeau payé sans destinataire'],nouvel_abonne:['🎉','Nouvel abonné Malino+'],paiement_recu:['💶','Paiement reçu'],paiement_echoue:['⚠️','Paiement échoué'],paiement_abandonne:['🛒','Paiement commencé puis abandonné'],resiliation:['👋','Résiliation'],resiliation_prevue:['👋','Résiliation programmée'],remboursement:['↩️','Remboursement'],abonne_sans_compte:['⚠️','Abonné sans compte reconnu'],webhook_erreur:['🚨','Erreur Stripe'],envoi_code_echec:['🚨','Code de connexion non envoyé'],envoi_cadeau_echec:['🚨','Cadeau non envoyé']};
const PUSHPUB='BFLJzcDWvgan1IMMnPf51wZb-fSJOCpnpv5yd-CBrMAjsNzUSDMy0iCBp5NzzjojAtClpyiH9nYpxdxe_fFPUCQ';
async function bellCount(){const {data,error}=await sb.rpc('admin_notifs_compte');if(error)return;const b=$('#bellN');if(b)b.textContent=data?(data>99?'99+':data):'';}
const PushA={
  sup(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;},
  ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!(navigator.standalone||matchMedia('(display-mode: standalone)').matches);},
  async reg(){try{return (await navigator.serviceWorker.getRegistration())||(await navigator.serviceWorker.register('sw.js'));}catch(e){return null;}},
  async etat(){if(!this.sup())return 'nosup';if(Notification.permission==='denied')return 'denied';const r=await this.reg();const s=r&&await r.pushManager.getSubscription();return s&&Notification.permission==='granted'?'on':'off';},
  async activer(){if(!this.sup())return 'nosup';const p=await Notification.requestPermission();if(p!=='granted')return 'denied';
    const r=await this.reg();await navigator.serviceWorker.ready;let s=await r.pushManager.getSubscription();
    if(!s){const k=atob(PUSHPUB.replace(/-/g,'+').replace(/_/g,'/'));s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(k,c=>c.charCodeAt(0))});}
    const j=s.toJSON(),{error}=await sb.rpc('malino_push_abonner',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent.slice(0,200)});if(error)throw error;
    await this.tester();return 'on';},
  async tester(){const {data:{session}}=await sb.auth.getSession();return fetch(SB_URL+'/functions/v1/malino-notif',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({test:true})}).then(r=>r.json()).catch(()=>({}));},
  async couper(){const r=await this.reg(),s=r&&await r.pushManager.getSubscription();if(s){await sb.rpc('malino_push_desabonner',{p_endpoint:s.endpoint});await s.unsubscribe();}}
};
async function openBell(){if($('#bellov'))return;const ov=document.createElement('div');ov.id='fiche';ov.innerHTML='<div class="fbar row"><button class="o" id="nBack">← Retour</button><b style="flex:1">🔔 Notifications</b></div><main id="bellov"><p class="mut">Chargement…</p></main>';document.body.appendChild(ov);document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow='';if(location.hash==='#notifs')try{history.replaceState(null,'',VIEW==='contrib'?'#contrib':location.pathname);}catch(e){}};$('#nBack').onclick=close;
  const {data,error}=await sb.rpc('admin_notifs',{p_limit:120}),m=$('#bellov');if(!m)return;
  if(error||!data){m.innerHTML='<p class="msg">Chargement impossible.</p>';return;}
  const vu=data.vu_le?Date.parse(data.vu_le):0,L=data.items||[];let jour='';
  const pc=async()=>{const el=$('#pushc');if(!el)return;const st=await PushA.etat();
    el.innerHTML=st==='on'?'<span class="small">📲 <b>Push activé</b> sur cet appareil</span><span class="row"><button class="o small" id="pT">Tester</button><button class="o small" id="pX">Couper</button></span>'
      :st==='nosup'?`<span class="small mut">📲 ${PushA.ios()?'Sur iPhone : ajoute Malino à l’écran d’accueil, ouvre-le depuis l’icône, puis reviens ici pour activer le push.':'Ce navigateur ne gère pas les notifications push.'}</span>`
      :st==='denied'?'<span class="small mut">📲 Notifications bloquées pour ce site : autorise-les dans les réglages du navigateur.</span>'
      :'<span class="small">📲 Reçois une notification sur ce téléphone à chaque évènement important</span><button class="small" id="pA">Activer</button>';
    const a=$('#pA');if(a)a.onclick=async()=>{a.disabled=true;a.textContent='…';try{await PushA.activer();}catch(e){alert('Activation impossible, réessaie.');}pc();};
    const t=$('#pT');if(t)t.onclick=async()=>{t.textContent='Envoi…';const j=await PushA.tester();t.textContent=j&&j.sent?'✅ Envoyé':'Rien reçu ?';};
    const x=$('#pX');if(x)x.onclick=async()=>{await PushA.couper();pc();};};
  m.innerHTML=`<div class="card row" id="pushc" style="justify-content:space-between"></div>`+(L.length?L.map(n=>{const [ic,ti]=NTYPE[n.type]||['🔔',n.type],d=new Date(n.cree_le),dj=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),h=dj!==jour?`<div class="nday">${dj===new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})?'Aujourd’hui':dj}</div>`:'';jour=dj;
    const sub=n.type.startsWith('contrib_')?esc(n.detail||''):[n.email,n.detail].filter(Boolean).map(esc).join(' · ');
    return h+`<div class="nit${Date.parse(n.cree_le)>vu?' new':''}" data-nt="${esc(n.type)}" data-ne="${esc(n.email||'')}"><span class="ic">${ic}</span><span class="tx"><b>${esc(ti)}</b>${sub?`<span>${sub}</span>`:''}</span><small>${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div>`;}).join(''):'<p class="mut small">Aucune notification pour le moment.</p>')
    +'<p class="small mut" style="text-align:center;margin:10px 0">Inscriptions, paiements, codes promo, cadeaux, résiliations, contributions commencées et terminées.</p>';
  pc();
  m.querySelectorAll('[data-nt]').forEach(el=>el.onclick=()=>{const t=el.dataset.nt,e=el.dataset.ne;
    if(t.startsWith('contrib_')){close();setView('contrib');return;}
    const f=e&&D&&D.familles.find(x=>(x.email||'').toLowerCase()===e.toLowerCase());if(f){close();openFiche(f.user_id);}});
  if(data.non_lus){await sb.rpc('admin_notifs_vu');bellCount();}
}
// ---------- Contributions : pages publiques où des personnes aident (voix, réponses), et ce qu'elles envoient ----------
const FNC=SB_URL+'/functions/v1/malino-contrib',HUBURL=location.origin+'/contribution.html',CURL=id=>HUBURL+'?d='+encodeURIComponent(id);
const CST={brouillon:['✏️ Brouillon','t-gratuit'],en_ligne:['🟢 En ligne','t-paye'],suspendue:['⏸️ Suspendue','t-essai'],cloturee:['🔒 Clôturée','t-echec']};
let DV=null,DVERR='',DVOPEN={},CFLT='nouv';
const isNew=r=>r.statut==='complet'&&!r.vu;
const cleOf=x=>x.cle||(x.cible?'ar:'+x.cible:'');
const CLEL={ar:'arabe',fr:'français',en:'anglais',cri:'cri',son:'son de lettre'};
const adoptBtn=(rid,x,e)=>cleOf(x)?(e.adopte?`<button class="small" style="background:#DCFCE7;color:#16A34A" data-adopt="${rid}|${esc(x.id)}|1" title="Retirer de l’appli">✓ Utilisée</button>`:`<button class="o small" data-adopt="${rid}|${esc(x.id)}|0">Utiliser</button>`):'';
async function loadDev(){const {data,error}=await sb.rpc('admin_contrib');DV=error?null:data;DVERR=error?(/admin_contrib|column|statut/.test(error.message||'')?'base':'err'):'';
  const n=DV?DV.reduce((a,d)=>a+(d.reponses||[]).filter(isNew).length,0):0,t=$('#tabN');if(t)t.textContent=n?n:'';
  if(VIEW==='contrib')drawContrib();else devLink();}
function devLink(){const el=$('#devlink');if(!el)return;if(!DV){el.innerHTML='';return;}
  const n=DV.reduce((a,d)=>a+(d.reponses||[]).filter(isNew).length,0),on=DV.filter(d=>d.statut==='en_ligne').length;
  el.innerHTML=`<div class="card row" style="cursor:pointer;justify-content:space-between" id="goC"><b>🤝 Contributions</b><span class="row"><span class="small mut">${on} en ligne</span>${n?`<span class="tag t-chaud">${n} nouvelle${n>1?'s':''}</span>`:''}<span class="go">›</span></span></div>`;

  const days=Object.keys(J).filter(d=>J[d]>=60).sort(),s7=dk(Date.now()-6*DAY),last=days[days.length-1]||null;
  const min=l=>Math.round(l.reduce((a,d)=>a+J[d],0)/60);
  return {J,days,j7:days.filter(d=>d>=s7).length,min7:min(days.filter(d=>d>=s7)),minTot:min(days),last,idle:last?Math.round((Date.parse(dk(Date.now()))-Date.parse(last))/DAY):null,seances:(kids||[]).reduce((a,k)=>a+(k.seances!=null?k.seances:(k.sessions||[]).length),0)};}
function accessEnd(f){const p=x=>x?Date.parse(x):0;return f.plan==='plus'&&!f.abo_statut?p(f.plus_jusqua):f.plan==='essai'?p(f.essai_fin):Math.max(p(f.essai_fin),p(f.plus_jusqua));}
// estimation de la chance d'achat, avec le pourquoi et la chose à faire
function predict(f,kids){
  const a=actOf(kids||f.enfants),now=Date.now(),why=[],pl=n=>n>1?'s':'';
  if(f.proprio)return {k:'co',tag:'👥 Co-parent',cls:'t-gratuit',score:null,a,why:['Rattaché(e) à la famille de '+f.proprio],act:'Rien à faire ici : tout se joue sur le compte principal.'};
  if(a.days.length)why.push(`${a.days.length} jour${pl(a.days.length)} de jeu au total · ${a.minTot} min`);
  if(a.days.length)why.push(`${a.j7}/7 jours joués cette semaine · ${a.min7} min`);
  why.push(a.last?`Dernière partie il y a ${a.idle?a.idle+' j':'moins d’un jour'}`:'Aucune partie jouée');
  if(f.checkout)why.push('💳 A commencé un paiement sans le terminer');
  if(f.abo_statut==='past_due')return {k:'impaye',tag:'💳 Paiement en échec',cls:'t-echec',score:50,a,why,act:'Le prélèvement a échoué : un petit mail pour l’inviter à mettre à jour sa carte.'};
  if(f.abo_statut&&['active','trialing'].includes(f.abo_statut))return {k:'client',tag:'✅ Client',cls:'t-paye',score:100,a,why,act:a.idle!=null&&a.idle>=7?`Abonné mais ne joue plus depuis ${a.idle} j : risque de résiliation. Lui montrer les nouveautés.`:'Tout va bien.'};
  const end=accessEnd(f),left=Math.ceil((end-now)/DAY),ended=f.plan==='gratuit',start=dk(Date.parse(f.cree_le)),endK=end?dk(end):dk(now);
  const tDays=a.days.filter(d=>d>=start&&d<=endK),tMin=Math.round(tDays.reduce((s,d)=>s+a.J[d],0)/60),after=a.days.filter(d=>d>endK);
  if(!ended&&end)why.push(`${f.plan==='plus'?'Malino+ offert':'Essai'} : fin dans ${left} j (${d(end)})`);
  if(ended&&end)why.push(`Accès terminé depuis ${-left} j · pendant l’accès : ${tDays.length} j, ${tMin} min`);
  let score=Math.min(30,4*a.days.length)+Math.min(20,Math.round(a.min7/3))+(a.j7>=4?8:0)+(f.checkout?20:0)+5;
  if(a.idle!=null&&a.idle>=4)score-=Math.min(30,a.idle*4);
  if(ended&&-left>14)score=Math.round(score*.5);
  const sc=x=>Math.max(2,Math.min(85,Math.round(x))),engaged=a.j7>=3||a.min7>=30;
  if(!a.days.length){if(ended||left<=5)return {k:'froid',tag:'🧊 N’a jamais joué',cls:'t-gratuit',score:3,a,why,act:ended?'Très peu de chances. Un dernier mail « besoin d’aide pour démarrer ? ».':'Peu de chances en l’état : un mail pour l’aider à lancer une première partie avant la fin.'};
    return {k:'debut',tag:'🌱 Pas encore démarré',cls:'t-essai',score:12,a,why,act:'Normal en début d’essai. Si rien dans 2 ou 3 jours, un petit mail pour l’aider à démarrer.'};}
  if(!ended){if(engaged&&left<=5)return {k:'chaud',tag:'🔥 Prêt à convertir',cls:'t-chaud',score:sc(score+5),a,why,act:`Fin d’accès dans ${left} j et l’enfant joue beaucoup : c’est le bon moment pour relancer en rappelant ses progrès.`};
    if(engaged)return {k:'accroche',tag:'👍 Accroché',cls:'t-paye',score:sc(score),a,why,act:'Il joue bien : le laisser profiter, relancer 2 ou 3 jours avant la fin.'};
    if(a.idle>=4)return {k:'decroche',tag:'😴 Décroche',cls:'t-essai',score:sc(score),a,why,act:'Il jouait puis s’est arrêté : une relance douce avec les progrès de l’enfant.'};
    return {k:'tiede',tag:'😐 Tiède',cls:'t-essai',score:sc(score),a,why,act:'Joue un peu : à surveiller, relancer avant la fin de l’accès.'};}
  if(after.length&&a.idle<=3)return {k:'potentiel',tag:'💎 Joue encore en gratuit',cls:'t-plus',score:sc(score+5),a,why,act:'Il revient même sans Malino+ : très bon signe. Lui proposer une offre ou un code.'};
  if(tDays.length>=3||tMin>=45)return -left<=14?{k:'potentiel',tag:'💎 Gros potentiel',cls:'t-plus',score:sc(score+5),a,why,act:`Il jouait bien pendant l’accès (${tDays.length} j, ${tMin} min) mais s’est arrêté à la fin : lui proposer une offre ou un code pour reprendre.`}
    :{k:'perdu',tag:'🕰️ Perdu de vue',cls:'t-gratuit',score:sc(score),a,why,act:'Il jouait bien mais c’est loin : une dernière relance avec une offre.'};
  return {k:'froid',tag:'❄️ Peu de chances',cls:'t-gratuit',score:sc(score),a,why,act:'A peu joué pendant l’accès : pas prioritaire.'};}

function barsHTML(J,c){const n=28,today=Date.now(),start=dk(Date.parse(c.cree_le)),end=accessEnd(c),endK=end?dk(end):'',cols=[];let mx=10;

  const j=await fnRapports({simulation:true,voir:mail}),m=ov.querySelector('main');
  if(!j||!j.mail){m.innerHTML='<p class="msg">Aucun e-mail prévu pour cette famille.</p>';return;}
  m.innerHTML=`<div class="card"><div class="small mut">À : ${esc(mail)}</div><b>${esc(j.mail.sujet)}</b></div><iframe id="vFrame" sandbox="" style="width:100%;height:75vh;border:0;border-radius:14px;background:#fff"></iframe>`;
  $('#vFrame').srcdoc=j.mail.html;}

function draw(){
  const F=D.familles,P=D.paiements,now=Date.now(),mois=new Date();mois.setDate(1);mois.setHours(0,0,0,0);
  const enfants=F.reduce((a,f)=>a+f.enfants.length,0),actifs=F.filter(f=>now-Date.parse(f.derniere_activite)<7*864e5).length;
  const t7f=F.map(f=>f.enfants.reduce((a,k)=>a+(k.t7||0),0)).filter(x=>x>=60),tmoy=t7f.length?Math.round(t7f.reduce((a,b)=>a+b,0)/t7f.length/60):0;
  const plus=F.filter(f=>f.plan==='plus'),abos=plus.filter(f=>f.abo_statut&&['active','trialing','past_due'].includes(f.abo_statut));
  const mrr=abos.reduce((a,f)=>a+(f.abo_formule==='annuel'?2999/12:399),0);
  const ok=P.filter(p=>p.statut==='paye'),total=ok.reduce((a,p)=>a+p.montant,0),dumois=ok.filter(p=>Date.parse(p.cree_le)>=mois).reduce((a,p)=>a+p.montant,0);
  const alertTypes={paiement_echoue:'💳 Paiement échoué',envoi_code_echec:'✉️ Code non envoyé',envoi_cadeau_echec:'✉️ Cadeau non envoyé',envoi_invitation_echec:'✉️ Invitation non envoyée',webhook_erreur:'⚠️ Erreur Stripe',abonne_sans_compte:'❓ Abonné sans compte',cadeau_sans_formulaire:'❓ Cadeau sans destinataire',resiliation:'👋 Résiliation',resiliation_prevue:'👋 Résiliation prévue',remboursement:'↩️ Remboursement'};
  const alerts=D.journal.filter(j=>alertTypes[j.type]&&now-Date.parse(j.cree_le)<30*864e5);
  F.forEach(f=>f._p=predict(f));
  const flt=F.filter(f=>(!q||f.email.includes(q)||(f.prenom||'').toLowerCase().includes(q)||f.enfants.some(k=>(k.nom||'').toLowerCase().includes(q)))&&FILTRES[FLT][1](f._p));
  const st=f=>f.plan==='plus'?`<span class="tag t-plus">👑 ${f.abo_statut?'Abonné '+(f.abo_formule||''):'Offert → '+d(f.plus_jusqua)}</span>${f.abo_statut==='past_due'?' <span class="tag t-echec">impayé</span>':''}`:f.plan==='essai'?`<span class="tag t-essai">Essai · ${jours(f.essai_fin)} j</span>`:'<span class="tag t-gratuit">Gratuit</span>';
  app.innerHTML=`
  <div class="kpis">
    <div class="kpi hl"><b>${eur(dumois)}</b><small>encaissé ce mois-ci</small></div>
    <div class="kpi hl"><b>${eur(total)}</b><small>total encaissé</small></div>
    <div class="kpi"><b>${eur(Math.round(mrr))}</b><small>revenu mensuel récurrent</small></div>
    <div class="kpi"><b>${abos.length}</b><small>abonnés payants</small></div>
    <div class="kpi"><b>${plus.length-abos.length}</b><small>Malino+ offerts</small></div>
    <div class="kpi"><b>${F.filter(f=>f.plan==='essai').length}</b><small>en essai</small></div>
    <div class="kpi"><b>${F.length}</b><small>familles inscrites</small></div>
    <div class="kpi"><b>${D.codes.reduce((a,k)=>a+k.utilisations,0)}</b><small>codes utilisés</small></div>
    <div class="kpi"><b>${enfants}</b><small>enfants</small></div>
    <div class="kpi"><b>${actifs}</b><small>actives sur 7 jours</small></div>
    <div class="kpi"><b>${tmoy} min</b><small>de jeu par famille active (7 j)</small></div>
    <div class="kpi"><b>${D.parrainages.inscrits}/${D.parrainages.envoyes}</b><small>parrainages réussis</small></div>
  </div>
  <div class="card"><h2>🚨 À traiter <span class="tag ${alerts.length?'t-echec':'t-paye'}">${alerts.length}</span></h2>${alerts.length?alerts.slice(0,15).map(a=>`<div class="alert"><span class="mut small" style="min-width:76px">${dh(a.cree_le)}</span><span><b>${alertTypes[a.type]}</b> ${esc(a.email||'')}<br><span class="small mut">${esc(a.detail||'')}</span></span></div>`).join(''):'<p class="mut small" style="margin:0">Rien à signaler sur les 30 derniers jours ✅</p>'}</div>
  ${autoCard()}
  <div class="card"><h2>🎟️ Codes promo <span class="mut small">${D.codes.length}</span></h2>
    <div class="row"><input id="cLib" placeholder="Où je le partage (ex. Facebook – groupe Parents 95)" maxlength="80" style="flex:1;min-width:220px"></div>
    <div class="row" style="margin-top:6px"><input id="cCode" placeholder="Code (vide = automatique)" maxlength="24" style="width:170px;text-transform:uppercase"><select id="cJours"><option value="14">14 jours</option><option value="30" selected>30 jours</option><option value="45">45 jours</option><option value="60">60 jours</option></select><input id="cMax" type="number" min="0" placeholder="Limite (0 = illimité)" style="width:150px"><input id="cExp" type="date" title="Expire le (facultatif)"><button id="cGo">Créer</button></div><p class="msg" id="cRes"></p>
    <div class="scroll"><table><tr><th>Code / lien</th><th>Où</th><th>Durée</th><th>Utilisé</th><th>En cours</th><th>Payants</th><th></th></tr>${D.codes.map(k=>`<tr><td><b>${esc(k.code)}</b><br><button class="o small" data-copy="${esc(k.code)}">Copier le lien</button></td><td>${esc(k.libelle)}<br><span class="small mut">créé le ${d(k.cree_le)}${k.dernier?' · dernier : '+d(k.dernier):''}${k.expire_le?' · expire le '+d(k.expire_le):''}</span></td><td>${k.jours} j</td><td><b>${k.utilisations}</b>${k.max_util?' / '+k.max_util:''}</td><td>${k.en_cours}</td><td>${k.payants}${k.utilisations?` <span class="small mut">(${Math.round(100*k.payants/k.utilisations)} %)</span>`:''}</td><td class="row"><button class="o small" data-cmax="${k.id}" data-max="${k.max_util||0}" data-exp="${k.expire_le||''}" data-act="${k.actif}">Limite</button><button class="${k.actif?'r':'o'} small" data-ctog="${k.id}" data-max="${k.max_util||0}" data-exp="${k.expire_le||''}" data-act="${k.actif}">${k.actif?'Désactiver':'Réactiver'}</button></td></tr>`).join('')||'<tr><td colspan="7" class="mut">Aucun code pour le moment</td></tr>'}</table></div></div>
  <div class="card"><h2>🎁 Offrir Malino+</h2><div class="row"><input type="email" id="gEmail" placeholder="e-mail de la famille"><select id="gMois"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">12 mois</option></select></div><div class="row" style="margin-top:6px"><input id="gMsg" placeholder="petit mot (facultatif)" maxlength="200" style="flex:1"><button id="gGo">Offrir et envoyer l’e-mail</button></div><p class="msg" id="gRes"></p></div>
  <div class="card"><h2>👨‍👩‍👧 Familles <span class="mut small">${F.length}</span></h2><div class="chips">${Object.entries(FILTRES).map(([k,[l,fn]])=>`<button class="chip ${FLT===k?'on':''}" data-flt="${k}">${l} <b>${F.filter(f=>fn(f._p)).length}</b></button>`).join('')}</div><input id="q" placeholder="Rechercher un e-mail ou un prénom" value="${esc(q)}" style="width:100%;margin-bottom:6px">${flt.map(f=>`<div class="fam" data-fiche="${f.user_id}"><div class="row" style="justify-content:space-between"><b style="word-break:break-all">${f.prenom?esc(f.prenom)+' · ':''}${esc(f.email)} <span class="go">›</span></b><span class="row">${st(f)}<button class="o small" data-gift="${esc(f.email)}">+1 mois</button></span></div><div class="row" style="margin:3px 0 2px"><span class="tag ${f._p.cls}">${f._p.tag}</span>${f._p.score!=null&&f._p.k!=='client'?`<span class="small mut">${f._p.score} % de chances</span>`:''}${f.offre_jusqua?`<span class="tag t-chaud">−30 % → ${d(f.offre_jusqua)}</span>`:''}</div><div class="small mut">Inscrit le ${d(f.cree_le)} · actif il y a ${ago(f.derniere_activite)}${f.total?` · payé ${eur(f.total)}`:''}${f.bonus_jours?` · +${f.bonus_jours} j parrainage`:''}${f.code?` · 🎟️ ${esc(f.code)}`:''}</div><div class="kids" style="margin-top:3px">${f.proprio?`<span class="small mut">👥 co-parent de ${esc(f.proprio)}</span>`:''}${f.enfants.map(k=>`<span class="kid">${esc(k.nom)} · niv. ${lvl(k.xp)} · ${k.seances} séances${k.t7>=60?` · ${Math.round(k.t7/60)} min/7 j`:''}</span>`).join('')||(f.proprio?'':'<span class="small mut">aucun enfant</span>')}</div></div>`).join('')||'<p class="mut small">Aucune famille</p>'}</div>
  <div class="card"><h2>💳 Paiements <span class="mut small">${P.length}</span></h2><div class="scroll"><table><tr><th>Date</th><th>E-mail</th><th>Type</th><th>Montant</th><th>Statut</th></tr>${P.map(p=>`<tr><td class="small">${dh(p.cree_le)}</td><td>${esc(p.email||'')}</td><td>${p.type==='cadeau'?'🎁 cadeau':'Abonnement'}</td><td>${eur(p.montant)}</td><td><span class="tag t-${p.statut}">${{paye:'payé',echec:'échec',rembourse:'remboursé'}[p.statut]||p.statut}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aucun paiement pour le moment</td></tr>'}</table></div></div>
  <div class="card"><h2>🎁 Cadeaux</h2><div class="scroll"><table><tr><th>Date</th><th>De</th><th>Pour</th><th>Durée</th><th>Statut</th></tr>${D.cadeaux.map(g=>`<tr><td class="small">${d(g.cree_le)}</td><td>${esc(g.offrant_prenom||'')}<br><span class="small mut">${esc(g.offrant_email||'')}</span></td><td>${esc(g.dest_email)}</td><td>${g.mois} mois</td><td><span class="tag ${g.statut==='applique'?'t-paye':g.statut==='paye'?'t-essai':'t-gratuit'}">${{attente:'non payé',paye:'en attente de connexion',applique:'activé'}[g.statut]}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aucun cadeau</td></tr>'}</table></div></div>
  <div id="devlink"></div>
  <div class="card"><details><summary>🛑 Demandes STOP (${D.stops.length})</summary><p class="small mut">Les adresses de cette liste ne reçoivent plus d’invitations ni de cadeaux par e-mail (les codes de connexion restent possibles).</p><div class="row"><input type="email" id="sEmail" placeholder="e-mail à bloquer"><button id="sAdd" class="r">Ajouter</button></div><table style="margin-top:6px">${D.stops.map(s=>`<tr><td>${esc(s.email)}</td><td class="small mut">${d(s.cree_le)}</td><td><button class="o" data-unstop="${esc(s.email)}">Retirer</button></td></tr>`).join('')}</table></details></div>
  <div class="card"><details><summary>📜 Journal complet</summary><table>${D.journal.map(j=>`<tr><td class="small mut">${dh(j.cree_le)}</td><td>${esc(j.type)}</td><td>${esc(j.email||'')}</td><td class="small">${esc(j.detail||'')}</td></tr>`).join('')}</table></details></div>
  <p class="small mut" style="text-align:center">Mis à jour à ${dh(D.maintenant)} · Stripe : compte Pace, produit Malino+</p>`;
  $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();const p=e.target.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  $('#cGo').onclick=async()=>{const r=$('#cRes'),e=$('#cExp').value;r.className='msg';
    const {data,error}=await sb.rpc('admin_code_creer',{p_code:$('#cCode').value,p_libelle:$('#cLib').value,p_jours:+$('#cJours').value,p_max:+($('#cMax').value||0),p_expire:e?new Date(e+'T23:59:59').toISOString():null});
    if(error||!data||!data.ok){r.textContent={libelle:'Indique où tu le partages',format:'Code : 4 à 24 lettres, chiffres ou tirets',existe:'Ce code existe déjà'}[data&&data.error]||'Échec, réessaie';return;}
    await load();const n=$('#cRes');n.className='msg ok';n.textContent='✅ Code créé : '+data.code;};
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const u=location.origin+'/?code='+b.dataset.copy;try{await navigator.clipboard.writeText(u);b.textContent='Lien copié ✅';}catch(e){prompt('Copie ce lien :',u);}});
  app.querySelectorAll('[data-cmax]').forEach(b=>b.onclick=async()=>{const v=prompt('Nombre maximum d’utilisations (0 = illimité)',b.dataset.max);if(v===null)return;await sb.rpc('admin_code_maj',{p_id:+b.dataset.cmax,p_max:+v||0,p_expire:b.dataset.exp||null,p_actif:b.dataset.act==='true'});load();});
  app.querySelectorAll('[data-ctog]').forEach(b=>b.onclick=async()=>{await sb.rpc('admin_code_maj',{p_id:+b.dataset.ctog,p_max:+b.dataset.max,p_expire:b.dataset.exp||null,p_actif:b.dataset.act!=='true'});load();});
  $('#gGo').onclick=()=>offrir($('#gEmail').value,$('#gMois').value,$('#gMsg').value);
  autoBind();
  app.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{FLT=b.dataset.flt;draw();});
  app.querySelectorAll('[data-fiche]').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;openFiche(r.dataset.fiche);});
  app.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{if(confirm(`Offrir 1 mois de Malino+ à ${b.dataset.gift} ? Un e-mail lui sera envoyé.`))offrir(b.dataset.gift,1,'');});
  devLink();
  $('#sAdd').onclick=async()=>{const e=$('#sEmail').value.trim();if(!e)return;await sb.rpc('admin_stop',{mail:e,ajouter:true});load();};
  app.querySelectorAll('[data-unstop]').forEach(b=>b.onclick=async()=>{await sb.rpc('admin_stop',{mail:b.dataset.unstop,ajouter:false});load();});
}

async function offrir(mail,mois,message){
  const res=$('#gRes');mail=(mail||'').trim();if(!/^\S+@\S+\.\S+$/.test(mail)){res.className='msg';res.textContent='Vérifie l’e-mail';return;}
  res.className='msg ok';res.textContent='Envoi…';
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'admin_offrir',email:mail,mois:+mois,message})}).then(r=>r.json()).catch(()=>({}));
  if(!r.ok){res.className='msg';res.textContent=r.error==='interdit'?'Accès refusé':'Échec, réessaie';return;}
  await load();const n=$('#gRes');n.className='msg ok';n.textContent=`✅ ${mois} mois offerts à ${mail}${r.applique?' (déjà actif sur son compte)':' (activé à sa première connexion)'}${r.envoye?' · e-mail envoyé':' · ⚠️ e-mail non envoyé'}`;
}
$('#refresh').onclick=load;
$('#bell').onclick=()=>openBell();
window.addEventListener('hashchange',()=>{if(location.hash==='#notifs'&&D)openBell();if(/^#(contrib|dev)$/.test(location.hash)&&VIEW!=='contrib')setView('contrib');});
document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('on',b.dataset.view===VIEW);b.onclick=()=>setView(b.dataset.view);});
load();
</script>
</body>
</html>

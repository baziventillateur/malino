// jours de jeu de toute la famille (un jour compte à partir d'1 minute)
function actOf(kids){const J={};(kids||[]).forEach(k=>Object.entries(k.jours||{}).forEach(([d,s])=>J[d]=(J[d]||0)+s));
  const days=Object.keys(J).filter(d=>J[d]>=60).sort(),s7=dk(Date.now()-6*DAY),last=days[days.length-1]||null;
  const min=l=>Math.round(l.reduce((a,d)=>a+J[d],0)/60);
  return {J,days,j7:days.filter(d=>d>=s7).length,min7:min(days.filter(d=>d>=s7)),minTot:min(days),last,idle:last?Math.round((Date.parse(dk(Date.now()))-Date.parse(last))/DAY):null,seances:(kids||[]).reduce((a,k)=>a+(k.seances!=null?k.seances:(k.sessions||[]).length),0)};}
function accessEnd(f){const p=x=>x?Date.parse(x):0;return f.plan==='plus'&&!f.abo_statut?p(f.plus_jusqua):f.plan==='essai'?p(f.essai_fin):Math.max(p(f.essai_fin),p(f.plus_jusqua));}
// estimation de la chance d'achat, avec le pourquoi et la chose à faire
function predict(f,kids){
  const a=actOf(kids||f.enfants),now=Date.now(),why=[],pl=n=>n>1?'s':'';
  if(f.proprio)return {k:'co',tag:'👥 Co-parent',cls:'t-gratuit',score:null,a,why:['Rattaché(e) à la famille de '+f.proprio],act:'Rien à faire ici : tout se joue sur le compte principal.'};
  if(a.days.length)why.push(`${a.days.length} jour${pl(a.days.length)} de jeu au total · ${a.minTot} min`);
  if(a.days.length)why.push(`${a.j7}/7 jours joués cette semaine · ${a.min7} min`);
  why.push(a.last?`Dernière partie il y a ${a.idle?a.idle+' j':'moins d’un jour'}`:'Aucune partie jouée');

// Hypothèse de départ (aucun abonné payant pour l'instant) : le rythme conseillé par Malino, 10 à 15 min par jour,
// 5 jours sur 7 pendant les 14 jours d'essai ≈ 2 h 30 de jeu, réparties sur au moins 6 jours (l'habitude compte autant que la durée).

const OBJ0={min:150,jours:6};
function cibleEssai(){
  const base=Object.assign({src:'base',n:0},OBJ0);if(!D||!D.familles||!D.paiements)return base;
  const pay={};D.paiements.filter(p=>p.statut==='paye'&&p.type!=='cadeau').forEach(p=>{const k=String(p.email||'').toLowerCase(),t=Date.parse(p.cree_le);if(k&&(!pay[k]||t<pay[k]))pay[k]=t;});
  const v=[];D.familles.forEach(f=>{const t=pay[String(f.email||'').toLowerCase()];if(!t||f.proprio)return;const a=actOf(f.enfants),lim=dk(t),ds=a.days.filter(x=>x<=lim);v.push({min:Math.round(ds.reduce((s,x)=>s+a.J[x],0)/60),jours:ds.length});});
  base.n=v.length;if(v.length<5)return base;
  const med=l=>{const t=l.slice().sort((x,y)=>x-y),m=t.length>>1;return t.length%2?t[m]:Math.round((t[m-1]+t[m])/2);};
  return {src:'clients',n:v.length,min:Math.max(20,med(v.map(x=>x.min))),jours:Math.max(2,med(v.map(x=>x.jours)))};}
const hm=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');
function objectifHTML(c,a){

  const pct=Math.round(min/O.min*100),max=Math.max(O.min*1.25,min*1.04),w=v=>Math.min(100,v/max*100).toFixed(1)+'%';
  const col=pct>=100?'#16A34A':pct>=50?'#E9A800':'#8E93AE';
  // date à laquelle l'objectif a été atteint, sinon projection au rythme actuel
  let projet='',cls='';

    <div class="ozones" style="--z1:${w(O.min*.5)};--z2:${w(O.min)}"><span>découverte</span><span>l’habitude se prend</span><span>prêt à payer</span></div>

    <div class="oexp hidden" id="oExp">${O.src==='clients'?`Cible calculée sur tes <b>${O.n} abonnés payants</b> : temps de jeu médian et nombre de jours médian avant leur premier paiement.`:`Cible de départ, en attendant de vrais abonnés : <b>10 à 15 min par jour, 5 jours sur 7</b> pendant les 14 jours d’essai, soit environ ${hm(O.min)} sur ${O.jours} jours. Les enfants qui jouent souvent, même peu à la fois, sont ceux qui gardent l’habitude. Dès 5 abonnés payants (${O.n} pour l’instant), la cible se recalcule toute seule avec leur temps de jeu réel avant de payer.`}</div></div>`;}

async function voirMail(mail){const ov=document.createElement('div');ov.id='fiche';ov.innerHTML='<div class="fbar row"><button class="o" id="vBack">← Retour</button><span class="small mut" style="flex:1">Aperçu : rien n’est envoyé</span></div><main><p class="mut">Chargement…</p></main>';document.body.appendChild(ov);document.body.style.overflow='hidden';
  $('#vBack').onclick=()=>{ov.remove();document.body.style.overflow='';};

// ---- Évolution par période (comparée à la période d'avant) et classement des familles ----
const PERS=[[7,'7 jours'],[30,'1 mois'],[91,'3 mois'],[182,'6 mois'],[365,'1 an']];
let PER=+(localStorage.getItem('adm_per')||7),RANK=localStorage.getItem('adm_rank')||'actif';
const jourFam=f=>f._J||(f._J=(f.enfants||[]).reduce((J,k)=>{Object.entries(k.jours||{}).forEach(([d,s])=>J[d]=(J[d]||0)+s);return J;},{}));
const fmtT=s=>{const m=Math.round((s||0)/60);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`;};
const ilya=t=>{if(!t)return '—';const m=Math.round((Date.now()-Date.parse(t))/6e4);return m<60?`${Math.max(1,m)} min`:m<1440?`${Math.round(m/60)} h`:`${Math.round(m/1440)} j`;};
// Date lisible : relatif si récent (il y a 10 min / 3 h, avec l'heure), sinon date + heure
const quand=t=>{if(!t)return '—';const x=new Date(t),m=(Date.now()-x)/6e4,h=x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(m<1)return 'à l’instant';if(m<60)return `il y a ${Math.round(m)} min · ${h}`;if(m<1440)return `il y a ${Math.round(m/60)} h · ${h}`;
  const hier=new Date();hier.setHours(0,0,0,0);hier.setDate(hier.getDate()-1);if(x>=hier)return `hier à ${h}`;
  return `le ${x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'})} à ${h}`;};
function periode(F,a,b,cur){const ka=dk(a),kb=dk(b),inR=t=>{t=Date.parse(t);return t>a&&t<=b;},S=D.series;let act=0,sec=0;
  F.forEach(f=>{let s=0,j=0;for(const [k,v] of Object.entries(jourFam(f)))if(k>ka&&k<=kb){s+=v;if(v>=60)j++;}if(cur)f._r={sec:s,jours:j};if(j)act++;sec+=s;});
  return {enc:S?S.paiements.filter(p=>inR(p.t)).reduce((x,p)=>x+p.m,0):D.paiements.filter(p=>p.statut==='paye'&&inR(p.cree_le)).reduce((x,p)=>x+p.montant,0),
    nouv:F.filter(f=>inR(f.cree_le)).length,act,sec,moy:act?sec/act:0,abos:S?S.abonnes.filter(inR).length:null,codes:S?S.codes.filter(inR).length:null};}
const delta=(c,p,fmt)=>{if(c==null||p==null)return '';fmt=fmt||(x=>x);const dv=Math.round((c-p)*100)/100;if(!dv)return '<span class="dl eq">= pareil</span>';const up=dv>0,pct=p?Math.round(Math.abs(dv)/p*100):null;
  return `<span class="dl ${up?'up':'dn'}">${up?'▲ +':'▼ −'}${fmt(Math.abs(dv))}${pct!=null?`<br>${up?'+':'−'}${pct} %`:''}</span>`;};
function evolHTML(F){const now=Date.now(),N=PER*DAY,c=periode(F,now-N,now,1),p=periode(F,now-2*N,now-N),lab=(PERS.find(x=>x[0]===PER)||PERS[0])[1];
  const k=(v,l,dl,hl)=>`<div class="kpi ${hl?'hl':''}"><b>${v}</b><small>${l}</small>${dl}</div>`;
  return `<div class="card evol"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">📈 Évolution</h2><div class="chips" style="margin:0">${PERS.map(([n,l])=>`<button class="chip ${PER===n?'on':''}" data-per="${n}">${l}</button>`).join('')}</div></div>
    <p class="small mut" style="margin:4px 0 8px">Sur les ${lab} écoulés, comparé aux ${lab} d’avant.</p>
    <div class="kpis">${k(eur(c.enc),'encaissé',delta(c.enc,p.enc,eur),1)}${k(c.nouv,'nouvelles familles',delta(c.nouv,p.nouv))}${k(c.act,'familles actives',delta(c.act,p.act))}${k(fmtT(c.sec),'de jeu au total',delta(c.sec,p.sec,fmtT))}${k(fmtT(c.moy),'par famille active',delta(c.moy,p.moy,fmtT))}${c.abos!=null?k(c.abos,'nouveaux abonnés',delta(c.abos,p.abos)):''}${c.codes!=null?k(c.codes,'codes utilisés',delta(c.codes,p.codes)):''}</div></div>`;}
const RANKS={actif:['🔥 Plus actives',f=>f._r.jours,f=>`${f._r.jours} j de jeu`,f=>f._r.jours>0],temps:['⏱️ Plus de temps',f=>f._r.sec,f=>fmtT(f._r.sec),f=>f._r.sec>0],
  vu:['🕐 Vues récemment',f=>Date.parse(f.derniere_activite)||0,f=>quand(f.derniere_activite),f=>!!f.derniere_activite],
  inscrit:['🆕 Inscrites récemment',f=>Date.parse(f.cree_le)||0,f=>quand(f.cree_le),()=>true],
  paye:['💳 Payantes',f=>f.total||0,f=>f.total?eur(f.total):'abonnée',f=>(f.total||0)>0||(f.abo_statut&&['active','trialing','past_due'].includes(f.abo_statut))]};
function rangHTML(F){const lab=(PERS.find(x=>x[0]===PER)||PERS[0])[1];F.forEach(f=>f._r=f._r||{sec:0,jours:0});
  const [,val,txt,keep]=RANKS[RANK]||RANKS.actif,L=F.filter(keep).sort((x,y)=>val(y)-val(x));
  return `<div class="card" data-plier="8" data-plk="classement" data-plrow=":scope > .rk"><h2>🏆 Classement des familles</h2><div class="chips">${Object.entries(RANKS).map(([k,[l]])=>`<button class="chip ${RANK===k?'on':''}" data-rank="${k}">${l}</button>`).join('')}</div>
    ${RANK==='actif'||RANK==='temps'?`<p class="small mut" style="margin:0 0 4px">Sur les ${lab} écoulés (bouton de période en haut).</p>`:''}
    ${L.length?L.map((f,i)=>`<div class="rk" data-fiche="${f.user_id}"><span class="rkn ${i<3?'top':''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><div class="rkm"><b><span class="live" data-live="${f.user_id}" title="En ligne"></span>${esc(f.prenom||f.email)}</b><small>${esc((f.enfants||[]).map(k=>k.nom).join(', ')||'—')}${f.prenom?' · '+esc(f.email):''}</small></div><span class="rkv">${txt(f)}</span></div>`).join(''):'<p class="small mut" style="margin:0">Personne pour l’instant sur cette période.</p>'}</div>`;}

  <div class="card" data-plier="8" data-plk="familles" data-plrow=":scope > .fam"><h2>👨‍👩‍👧 Familles <span class="mut small">${F.length}</span><span class="livecount" id="liveN"></span></h2><div class="chips">${Object.entries(FILTRES).map(([k,[l,fn]])=>`<button class="chip ${FLT===k?'on':''}" data-flt="${k}">${l} <b>${F.filter(f=>fn(f._p)).length}</b></button>`).join('')}</div><input id="q" placeholder="Rechercher un e-mail ou un prénom" value="${esc(q)}" style="width:100%;margin-bottom:6px">${flt.map(f=>`<div class="fam" data-fiche="${f.user_id}"><div class="row" style="justify-content:space-between"><b style="word-break:break-all"><span class="live" data-live="${f.user_id}" title="En ligne"></span>${f.prenom?esc(f.prenom)+' · ':''}${esc(f.email)} <span class="go">›</span></b><span class="row">${st(f)}<button class="o small" data-gift="${esc(f.email)}">+1 mois</button></span></div><div class="row" style="margin:3px 0 2px"><span class="tag ${f._p.cls}">${f._p.tag}</span>${f._p.score!=null&&f._p.k!=='client'?`<span class="small mut">${f._p.score} % de chances</span>`:''}${f.offre_jusqua?`<span class="tag t-chaud">−30 % → ${d(f.offre_jusqua)}</span>`:''}</div><div class="small mut">Inscrit le ${d(f.cree_le)} · actif il y a ${ilya(f.derniere_activite)}${f.total?` · payé ${eur(f.total)}`:''}${f.bonus_jours?` · +${f.bonus_jours} j parrainage`:''}${f.code?` · 🎟️ ${esc(f.code)}`:''}</div><div class="kids" style="margin-top:3px">${f.proprio?`<span class="small mut">👥 co-parent de ${esc(f.proprio)}</span>`:''}${f.enfants.map(k=>`<span class="kid">${esc(k.nom)} · niv. ${lvl(k.xp)} · ${k.seances} séances${k.t7>=60?` · ${Math.round(k.t7/60)} min/7 j`:''}</span>`).join('')||(f.proprio?'':'<span class="small mut">aucun enfant</span>')}</div></div>`).join('')||'<p class="mut small">Aucune famille</p>'}</div>
  <div class="card"><h2>💳 Paiements <span class="mut small">${P.length}</span></h2><div class="scroll"><table data-plier="5" data-plk="paiements"><tr><th>Date</th><th>E-mail</th><th>Type</th><th>Montant</th><th>Statut</th></tr>${P.map(p=>`<tr><td class="small">${dh(p.cree_le)}</td><td>${esc(p.email||'')}</td><td>${p.type==='cadeau'?'🎁 cadeau':'Abonnement'}</td><td>${eur(p.montant)}</td><td><span class="tag t-${p.statut}">${{paye:'payé',echec:'échec',rembourse:'remboursé'}[p.statut]||p.statut}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aucun paiement pour le moment</td></tr>'}</table></div></div>
  <div class="card"><h2>🎁 Cadeaux</h2><div class="scroll"><table data-plier="5" data-plk="cadeaux"><tr><th>Date</th><th>De</th><th>Pour</th><th>Durée</th><th>Statut</th></tr>${D.cadeaux.map(g=>`<tr><td class="small">${d(g.cree_le)}</td><td>${esc(g.offrant_prenom||'')}<br><span class="small mut">${esc(g.offrant_email||'')}</span></td><td>${esc(g.dest_email)}</td><td>${g.mois} mois</td><td><span class="tag ${g.statut==='applique'?'t-paye':g.statut==='paye'?'t-essai':'t-gratuit'}">${{attente:'non payé',paye:'en attente de connexion',applique:'activé'}[g.statut]}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aucun cadeau</td></tr>'}</table></div></div>
  <div id="devlink"></div>
  <div class="card"><details><summary>🛑 Demandes STOP (${D.stops.length})</summary><p class="small mut">Les adresses de cette liste ne reçoivent plus d’invitations ni de cadeaux par e-mail (les codes de connexion restent possibles).</p><div class="row"><input type="email" id="sEmail" placeholder="e-mail à bloquer"><button id="sAdd" class="r">Ajouter</button></div><table style="margin-top:6px" data-plier="5" data-plk="stops">${D.stops.map(s=>`<tr><td>${esc(s.email)}</td><td class="small mut">${d(s.cree_le)}</td><td><button class="o" data-unstop="${esc(s.email)}">Retirer</button></td></tr>`).join('')}</table></details></div>
  <div class="card"><details><summary>📜 Journal complet</summary><table data-plier="10" data-plk="journal">${D.journal.map(j=>`<tr><td class="small mut">${dh(j.cree_le)}</td><td>${esc(j.type)}</td><td>${esc(j.email||'')}</td><td class="small">${esc(j.detail||'')}</td></tr>`).join('')}</table></details></div>
  ${rangHTML(F)}
  <p class="small mut" style="text-align:center">Mis à jour à ${dh(D.maintenant)} · Stripe : compte Pace, produit Malino+</p>`;
  app.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{PER=+b.dataset.per;localStorage.setItem('adm_per',PER);keepY(draw);});
  app.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{RANK=b.dataset.rank;localStorage.setItem('adm_rank',RANK);keepY(draw);});
  $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();const p=e.target.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p);};
  $('#cGo').onclick=async()=>{const r=$('#cRes'),e=$('#cExp').value;r.className='msg';
    const {data,error}=await sb.rpc('admin_code_creer',{p_code:$('#cCode').value,p_libelle:$('#cLib').value,p_jours:+$('#cJours').value,p_max:+($('#cMax').value||0),p_expire:e?new Date(e+'T23:59:59').toISOString():null});
    if(error||!data||!data.ok){r.textContent={libelle:'Indique où tu le partages',format:'Code : 4 à 24 lettres, chiffres ou tirets',existe:'Ce code existe déjà'}[data&&data.error]||'Échec, réessaie';return;}
    await load();const n=$('#cRes');n.className='msg ok';n.textContent='✅ Code créé : '+data.code;};
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const u=location.origin+'/?code='+b.dataset.copy;try{await navigator.clipboard.writeText(u);b.textContent='Lien copié ✅';}catch(e){prompt('Copie ce lien :',u);}});
  app.querySelectorAll('[data-cmax]').forEach(b=>b.onclick=async()=>{const v=prompt('Nombre maximum d’utilisations (0 = illimité)',b.dataset.max);if(v===null)return;await sb.rpc('admin_code_maj',{p_id:+b.dataset.cmax,p_max:+v||0,p_expire:b.dataset.exp||null,p_actif:b.dataset.act==='true'});load();});
  app.querySelectorAll('[data-ctog]').forEach(b=>b.onclick=async()=>{await sb.rpc('admin_code_maj',{p_id:+b.dataset.ctog,p_max:+b.dataset.max,p_expire:b.dataset.exp||null,p_actif:b.dataset.act!=='true'});load();});
  $('#gGo').onclick=()=>offrir($('#gEmail').value,$('#gMois').value,$('#gMsg').value);
  autoBind();
  app.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{FLT=b.dataset.flt;draw();});
  app.querySelectorAll('[data-fiche]').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;openFiche(r.dataset.fiche);});
  app.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{if(confirm(`Offrir 1 mois de Malino+ à ${b.dataset.gift} ? Un e-mail lui sera envoyé.`))offrir(b.dataset.gift,1,'');});
  devLink();
  $('#sAdd').onclick=async()=>{const e=$('#sEmail').value.trim();if(!e)return;await sb.rpc('admin_stop',{mail:e,ajouter:true});load();};
  app.querySelectorAll('[data-unstop]').forEach(b=>b.onclick=async()=>{await sb.rpc('admin_stop',{mail:b.dataset.unstop,ajouter:false});load();});
}

const JEUF=[
 ['📈 Niveaux du joueur','Plus les niveaux sont longs, plus un haut niveau veut dire « a joué longtemps ».',[
   ['xpK','XP pour passer du niveau 1 au 2','Plus c’est haut, plus tous les niveaux sont longs.',50,5000,5],
   ['xpE','Courbe','2 : chaque niveau un peu plus long que le précédent · 2,5 : beaucoup plus long en haut.',1,3.5,0.05]],'niv'],
 ['🪙 Pièces','',[
   ['coinMul','Quantité de pièces (%)','100 = normal · 50 = deux fois moins · 200 = deux fois plus.',10,300,5],
   ['coinLv','Bonus de pièces par niveau (%)','5 = +5 % à chaque niveau (deux fois plus au niveau 21).',0,20,0.5]]],
 ['🗝️ Coffres','',[
   ['cofDay','Coffres par jour, au maximum','Mission du jour comprise.',1,10,1],
   ['cofGame','Coffres de partie par jour, au maximum','Gagnés après une bonne partie.',0,5,1],
   ['cof3','Chance après une partie à 3 ⭐ (%)','',0,100,1],
   ['cof2','Chance après une partie à 2 ⭐ (%)','',0,100,1],
   ['cofWorld','Chance quand un monde est terminé (%)','',0,100,1],
   ['cofH','Heures avant de pouvoir ouvrir','',1,48,1],
   ['cofSlots','Emplacements de coffres','',1,8,1]]],
 ['🎨 Objets offerts','Objets du perso donnés en cadeau : niveau gagné, badge rare, coffre épique, coffre du jour.',[
   ['objPartie','Objets offerts par partie, au maximum','Compte tout ce qui est gagné jusqu’à la partie suivante (coffres ouverts compris). 0 = jamais.',0,5,1]]],
 ['🎁 Demandes de cadeaux','Une clé 🔑 permet à l’enfant de demander un cadeau.',[
   ['keyDays','Jours de jeu pour gagner une clé','Comptés depuis la dernière clé gagnée en jouant.',1,30,1],
   ['keyMin','Minutes de jeu pour gagner une clé','180 = 3 h, sur ces jours.',10,1200,10],
   ['keyChest','Chance de trouver une clé dans un coffre (%)','Coffre « bon cadeau » ; deux fois plus dans un coffre épique. Jamais dans une farce.',0,50,1]]],
 ['🔓 Jeux débloqués au niveau','Un jeu déjà ouvert pour un enfant le reste.',[['u_heure','🕐 L’heure'],['u_quoi','🔦 Qui a changé ?'],['u_formes','📐 Formes'],['u_chiffres','💡 Chiffres éclair'],['u_probl','🧮 Problèmes'],['u_drapeaux','🚩 Drapeaux'],['u_espace','🪐 Sciences'],['u_ortho','✍️ Orthographe']].map(([k,l])=>[k,l,'',1,60,1])],
 ['👋 Sans compte','',[['wall','Parties avant la connexion obligatoire','',1,10,1]]]];
let JEUD=null;
function jeuNiv(v){const t=L=>Math.round(v.xpK*Math.pow(Math.max(0,L-1),v.xpE)/10)*10,h=L=>{const m=Math.round(t(L)/160);return m<60?`${m} min`:m<1440?`${Math.round(m/6)/10} h`.replace('.',','):`${Math.round(m/60)} h`;};
  return `<div class="jprev">${[5,10,20,30,50].map(L=>`<span><b>Niv. ${L}</b>${h(L)}</span>`).join('')}</div><p class="small mut" style="margin:4px 0 0">Temps de jeu estimé pour atteindre le niveau (environ 160 XP par minute de jeu).</p>`;}
function drawJeu(){const v=JEUD||(JEUD=Object.assign({},JEU));
  app.innerHTML=`<p class="small mut" style="margin:0 0 8px">Ces réglages s’appliquent à tous les enfants, au prochain lancement de l’appli. Les valeurs de base sont rappelées sous chaque case.</p>`+JEUF.map(([t,h,F,x])=>`<div class="card jcard"><h2>${t}</h2>${h?`<p class="small mut" style="margin:-4px 0 6px">${h}</p>`:''}${F.map(([k,l,a,mn,mx,stp])=>`<label class="jrow ${v[k]!==JEU0[k]?'chg':''}"><span><b>${l}</b>${a?`<small>${a}</small>`:''}<small class="jbase">base : ${String(JEU0[k]).replace('.',',')}</small></span><input type="number" inputmode="decimal" data-jeu="${k}" min="${mn}" max="${mx}" step="${stp}" value="${v[k]}"></label>`).join('')}${x==='niv'?`<div id="jniv">${jeuNiv(v)}</div>`:''}</div>`).join('')
   +`<div class="jbar"><button id="jSave">💾 Enregistrer</button><button class="o" id="jBase">↺ Valeurs de base</button><span class="msg" id="jRes"></span></div>`;
  app.querySelectorAll('[data-jeu]').forEach(i=>i.oninput=()=>{const k=i.dataset.jeu,n=parseFloat(String(i.value).replace(',','.'));if(isFinite(n))JEUD[k]=n;i.closest('.jrow').classList.toggle('chg',JEUD[k]!==JEU0[k]);if(k==='xpK'||k==='xpE')$('#jniv').innerHTML=jeuNiv(JEUD);});
  $('#jBase').onclick=()=>{if(!confirm('Revenir à toutes les valeurs de base ?'))return;JEUD=Object.assign({},JEU0);drawJeu();};
  $('#jSave').onclick=async()=>{const r=$('#jRes'),p={};let bad='';
    JEUF.forEach(([,,F])=>F.forEach(([k,l,,mn,mx])=>{const n=+JEUD[k];if(!isFinite(n)||n<mn||n>mx)bad=bad||`${l} : entre ${mn} et ${mx}`;else if(n!==JEU0[k])p[k]=n;}));
    if(bad){r.className='msg';r.textContent='⚠️ '+bad;return;}
    r.className='msg ok';r.textContent='Enregistrement…';const {data,error}=await sb.rpc('admin_jeu_set',{p});
    if(error){r.className='msg';r.textContent='Échec, réessaie';return;}
    JEU=Object.assign({},JEU0,data||{});JEUD=Object.assign({},JEU);drawJeu();const n=$('#jRes');n.className='msg ok';n.textContent='✅ Enregistré : appliqué au prochain lancement de l’appli';};}
function keepY(fn){const y=scrollY;fn();scrollTo(0,y);}
async function offrir(mail,mois,message){
  const res=$('#gRes');mail=(mail||'').trim();if(!/^\S+@\S+\.\S+$/.test(mail)){res.className='msg';res.textContent='Vérifie l’e-mail';return;}
  res.className='msg ok';res.textContent='Envoi…';
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'admin_offrir',email:mail,mois:+mois,message})}).then(r=>r.json()).catch(()=>({}));
  if(!r.ok){res.className='msg';res.textContent=r.error==='interdit'?'Accès refusé':'Échec, réessaie';return;}
  await load();const n=$('#gRes');n.className='msg ok';n.textContent=`✅ ${mois} mois offerts à ${mail}${r.applique?' (déjà actif sur son compte)':' (activé à sa première connexion)'}${r.envoye?' · e-mail envoyé':' · ⚠️ e-mail non envoyé'}`;
}
$('#refresh').onclick=load;
$('#bell').onclick=()=>openBell();
window.addEventListener('hashchange',()=>{if(location.hash==='#notifs'&&D)openBell();if(/^#(contrib|dev)$/.test(location.hash)&&VIEW!=='contrib')setView('contrib');});
document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('on',b.dataset.view===VIEW);b.onclick=()=>setView(b.dataset.view);});
load();
</script>

<script>
// Langue de l'appli : ?lang=en ou ?lang=fr, sinon le choix enregistré, sinon la langue du navigateur sur un appareil neuf
(function(){var K='malino_lang',l=null;try{var q=new URLSearchParams(location.search).get('lang');
  if(q==='fr'||q==='en'){l=q;localStorage.setItem(K,l);}else l=localStorage.getItem(K);
  if(l!=='fr'&&l!=='en'){var known=false;for(var i=0;i<localStorage.length;i++){if(/^(supercerveau|malino|sb-)/.test(localStorage.key(i)||'')){known=true;break;}}
    l=!known&&/^en/i.test(navigator.language||'')?'en':'fr';localStorage.setItem(K,l);}}catch(e){l=l||'fr';}
  window.MLANG=l;
  if(l!=='fr'){document.documentElement.lang=l;document.write('<script src="lang-'+l+'.js"><\/script>');}
})();
</script>

<style>
:root{
  --v:#7B5CFF;--vd:#5A3BE0;--g:#22C55E;--gd:#16A34A;--r:#FF5A64;--rd:#E03A45;
  --y:#FFC83D;--yd:#E5A500;--b:#2EA3FF;--bd:#1679D1;--o:#FF9A1F;--od:#D97A00;
  --p:#FF6FB5;--pd:#D94C93;--ink:#24263A;--ink2:#565B76;--mut:#9AA0B8;
  --card:#fff;--line:#E7E9F3;--soft:#F4F5FB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box;min-width:0}
html,body,button{touch-action:manipulation}
button{font-size:inherit}
html{background:#E9E0FF}
body{font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:linear-gradient(170deg,#BFE6FF 0%,#E3DAFF 55%,#FFE3F1 100%) fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input,select,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;padding:0;font-size:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.read{font-family:'Andika','Fredoka',sans-serif}
h1,h2,h3,h4{font-weight:700}

/* Boutons « 3D » */
.btn{--c:var(--v);--d:var(--vd);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;font-size:20px;line-height:1.15;border-radius:18px;padding:14px 18px;box-shadow:0 5px 0 var(--d);transition:transform .07s,box-shadow .07s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn.g{--c:var(--g);--d:var(--gd)}.btn.y{--c:var(--y);--d:var(--yd);color:#4a3200}.btn.b{--c:var(--b);--d:var(--bd)}
.btn.o{--c:var(--o);--d:var(--od)}.btn.r{--c:var(--r);--d:var(--rd)}.btn.p{--c:var(--p);--d:var(--pd)}
.btn.w{--c:#fff;--d:#D6DAEA;color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.sm{font-size:16px;padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 var(--d)}
.btn[disabled]{filter:grayscale(.6) opacity(.55);pointer-events:none}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 4px 0 rgba(36,38,58,.08),0 10px 24px rgba(36,38,58,.06)}
.xbtn{width:46px;height:46px;border-radius:14px;background:#fff;font-size:22px;font-weight:700;color:var(--ink2);box-shadow:0 3px 0 #D6DAEA;flex:none}
.xbtn:active{transform:translateY(3px);box-shadow:0 0 0 #D6DAEA}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.07);white-space:nowrap}

/* Accueil */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.avm{width:68px;height:68px;flex:none;border-radius:50%;box-shadow:0 0 0 4px #fff,0 6px 12px rgba(0,0,0,.14)}
.avm svg,.gav svg,.bigav svg,.mav svg,.ith svg{width:100%;height:100%;display:block;overflow:visible}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hello{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvlrow{display:flex;align-items:center;gap:8px}
.lvlbadge{background:var(--v);color:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.xpbar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px;transition:width .6s}
.xpt{font-size:12px;color:var(--ink2);font-weight:500}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.week{display:flex;justify-content:space-between;gap:4px;margin-bottom:12px;padding:10px 12px}
.day{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink2)}
.day b{display:flex;align-items:center;justify-content:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:17px}
.day.done b{background:#FFE3BF}
.day.today b{box-shadow:0 0 0 3px var(--v)}
.day.miss b{background:#ECEEF6;color:var(--mut)}
.giftban{background:var(--p);color:#fff;border-radius:18px;padding:12px 14px;font-weight:600;margin-bottom:12px;box-shadow:0 5px 0 var(--pd);animation:pulse 1.6s infinite;cursor:pointer}
.mission{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mtx{flex:1}
.mission h3{margin:0 0 6px;font-size:16px;color:var(--ink2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:6px 9px;font-weight:600;font-size:15px}
.step.ok{background:#DCFCE7;color:#166534}
.chest{font-size:50px;line-height:1;flex:none;filter:grayscale(1) opacity(.45)}
.chest.ready{filter:none;animation:wiggle 1s infinite}
.chest.open{filter:none}
.play{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:14px;border-radius:24px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d)}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.play .ico{font-size:40px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);border-radius:18px;flex:none}
.play .tx{flex:1;min-width:0}
.play .t1{display:block;font-size:26px;font-weight:700;line-height:1.1}
.play .t2{display:block;font-size:15px;font-weight:500;opacity:.95;margin-top:3px}
.play .t3{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px}
.play .mbar{display:block;height:10px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:8px;overflow:hidden}
.play .mbar i{display:block;height:100%;background:#fff;border-radius:99px}
.play.locked{filter:grayscale(.85);opacity:.7}
.play .lock{position:absolute;right:14px;top:12px;font-size:22px}
.play.pulse{animation:pulse 1.6s infinite}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mini{background:#fff;border-radius:20px;padding:12px 6px;box-shadow:0 5px 0 #D6DAEA;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini span{font-size:32px}
.mini:active{transform:translateY(4px);box-shadow:0 1px 0 #D6DAEA}
.auth{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#7B5CFF,#4A36E0);display:flex;padding:16px;overflow:auto}
.abox{position:relative;background:#fff;border-radius:24px;padding:18px 16px;width:100%;max-width:400px;margin:auto;text-align:center;box-shadow:0 6px 0 #D9D0FF,0 20px 40px rgba(20,8,90,.35)}
.alogo{width:60px;height:60px;border-radius:15px}
.abox h2{font-size:22px;margin:6px 0}.abox p{color:var(--ink2);font-size:15px;line-height:1.4;margin:4px 0 12px}
.abox .fld{text-align:left;margin-bottom:10px;font-size:15px}
.acode{text-align:center;letter-spacing:6px;font-size:22px!important}
.alink{display:block;margin:8px auto 0;color:var(--v);font-weight:600;font-size:14px;padding:6px}
.alink:disabled{color:#a9a4c6}
.amsg{margin:0 0 8px;color:#C0392B;font-weight:600;font-size:14px}.amsg.ok{color:#27795a}.amsg:empty{display:none}
.aclose{position:absolute;right:8px;top:8px}
.bigemoji.sm{font-size:46px!important;line-height:1.1!important;margin:0 0 2px!important}.mbox .fld{text-align:left;display:block;margin-bottom:8px}.gseg{display:flex;gap:8px}.gseg button{flex:1}
.onb{z-index:72}.obox{max-width:430px;text-align:center;padding:14px 14px 10px}
.odots{display:flex;justify-content:center;gap:5px;margin:0 0 6px}.odots i{width:22px;height:5px;border-radius:3px;background:#E6E0FB}.odots i.ok{background:#B9A6FF}.odots i.on{background:var(--v)}
.oico{font-size:40px;line-height:1.1}.obox h2{font-size:21px;margin:4px 0 6px}.obox p{font-size:14.5px;margin:0 0 10px;color:var(--ink2);line-height:1.4}
.ocards{display:grid;gap:6px;margin:0 0 10px;text-align:left}.ocards div{display:grid;grid-template-columns:30px 1fr;column-gap:8px;background:#F6F3FF;border-radius:12px;padding:7px 10px}.ocards span{grid-row:span 2;font-size:22px;align-self:center}.ocards b{font-size:14px}.ocards small{font-size:12.5px;color:var(--ink2);line-height:1.3}
.olab{font-weight:700;color:var(--ink)!important;text-align:left;margin:4px 0 6px!important;font-size:14px!important}
.ochips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}.ochips button{background:#F1EDFF;color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:600;border:2px solid transparent}.ochips button.on{background:#fff;border-color:var(--v);color:var(--vd)}
.otip{background:#FFF8E1;border-radius:12px;padding:8px 10px;text-align:left;font-size:13px!important;color:#5C4400!important}
.osteps{display:grid;gap:6px;margin:0 0 10px;text-align:left}.osteps div{display:flex;gap:8px;align-items:center;background:#F6F3FF;border-radius:12px;padding:7px 10px;font-size:13.5px}.osteps div>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--v);color:#fff;display:grid;place-items:center;font-size:13px}
.odemo{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:0 0 10px}.odemo span{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 8px}.odemo .ok{background:#DCFCE7;color:#166534}.odemo .ko{background:#FFE4E6;color:#B4232E}
.ocmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 10px;text-align:left}.ocmp div{display:flex;flex-direction:column;gap:2px;background:#F4F6FA;border-radius:12px;padding:8px;font-size:12.5px}.ocmp div.p{background:linear-gradient(160deg,#F1E7FF,#E1CCFF)}.ocmp b{font-size:13.5px;margin-bottom:2px}
.onav .btn.o{background:#EEE9FF;color:var(--vd);box-shadow:0 3px 0 #D6CCFF}
.onav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}.onav .btn{flex:1}.onav span{flex:1}
.shbox{margin-top:12px;padding-top:10px;border-top:1px dashed #DDD6F7}.shbox .prow small{color:var(--mut);font-size:12px;margin-left:auto}
.tleg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--ink2);margin-top:4px}.tleg span{display:flex;align-items:center;gap:4px}.tleg i{width:10px;height:10px;border-radius:3px;display:inline-block}.tleg small{margin-left:auto;color:var(--mut)}
.anote{background:#FFF3C9;color:#6A4A00;border-radius:12px;padding:8px 10px;font-size:14px!important;font-weight:600}
.parentbtn.plan{background:linear-gradient(90deg,#FFE27A,#FFC83D);color:#5C3D00}.parentbtn.plan.on{background:linear-gradient(90deg,#B58AFF,#7B3CFF);color:#fff}
.planban{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;background:linear-gradient(100deg,#FFF3C9,#FFE08A);border-radius:16px;padding:9px 12px;margin:0 0 10px;box-shadow:0 3px 0 #E5B93A;color:#5C3D00}
.planban.g{background:linear-gradient(100deg,#EFE4FF,#D2B8FF);box-shadow:0 3px 0 #9B6BFF;color:#3B1490}.planban b{font-size:15px}.planban small{font-size:12.5px;opacity:.85}
.plist{list-style:none;padding:0;margin:6px 0 12px;text-align:left;font-size:15px;line-height:1.35}.plist li{padding:4px 0}
.okline{font-size:14px;color:var(--ink2);margin:0 0 4px}.fine{font-size:12px;color:var(--mut);margin:6px 0 0}
.planbtn{flex-direction:column;gap:0}.planbtn small{font-size:12px;font-weight:600;opacity:.9}
.orow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}.orow .alink{margin:0}
.gseg{margin-bottom:10px}.gseg button{display:flex;flex-direction:column;line-height:1.1}.gseg small{font-size:12px;font-weight:600;opacity:.8}
.invl{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px;background:#F4F1FF;border-radius:12px;padding:8px 10px;margin:0 0 10px;word-break:break-all}
.plock{position:relative}.plockin{filter:blur(5px);pointer-events:none;max-height:440px;overflow:hidden;user-select:none}
.plockov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(255,255,255,.5);gap:4px}.plockov b{font-size:18px}.plockov p{margin:0 0 6px;color:var(--ink2);font-size:14px}
.cur.lk{background:#FFE08A;color:#5C3D00}
.dtier{display:inline-block;font-weight:700;border-radius:99px;padding:0 7px;font-size:11.5px;line-height:1.55;background:rgba(43,33,96,.08);color:inherit;vertical-align:1px}
.dstars{display:inline-flex;gap:1px;vertical-align:-2px}.dstars .ds{width:13px;height:13px}
.dstars .ds path{fill:#DCD8EC;stroke:#C9C3E0;stroke-width:1.2;stroke-linejoin:round}
.dstars .ds.on path{fill:url(#gStar);stroke:#C98A00}.dstars .ds.on .hl{fill:none;stroke:#FFF6C8;stroke-width:1.3;stroke-linecap:round;opacity:.9}
.dstars .ds.on{filter:drop-shadow(0 1px 0 rgba(120,70,0,.35))}
.dname{color:var(--mut);font-size:12px}
.tt .dstars .ds:not(.on) path{fill:rgba(255,255,255,.3);stroke:rgba(255,255,255,.5)}.tt .dtier{background:rgba(255,255,255,.22)}
.tt .ttl{display:block;margin-top:2px;line-height:1}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.parentrow{display:flex;gap:8px;justify-content:center;margin-top:6px}.parentrow .parentbtn{margin:0;display:inline-block;text-decoration:none}
.parentbtn{display:block;margin:6px auto 0;color:var(--ink2);font-weight:600;font-size:15px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.6)}

/* Jeu */
.game{display:flex;flex-direction:column;position:relative}
.gtop{display:flex;align-items:center;gap:10px}
.gprog{flex:1;height:18px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.gprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),#7BE495);border-radius:99px;transition:width .4s}
.combo{min-width:66px;text-align:right;font-weight:700;font-size:20px;color:var(--od)}
.clock{flex:1;text-align:center;font-size:30px;font-weight:700}
.clock.hurry{color:var(--r);animation:pulse .5s infinite}
.gmid{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 10px}
.gav{width:74px;height:74px}
.gav.bounce{animation:bounce .5s}
.sscore{font-size:22px;font-weight:700;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.qcard{position:relative;background:#fff;border-radius:28px;padding:30px 14px 26px;text-align:center;box-shadow:0 6px 0 rgba(36,38,58,.1);margin-bottom:16px;min-height:clamp(180px,26vh,260px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.qcard.in{animation:qin .22s ease-out}
.q{font-size:clamp(44px,13vw,72px);font-weight:700;white-space:nowrap;line-height:1.2}
.slot{display:inline-block;min-width:1.25em;padding:0 .12em;border-radius:16px;background:var(--soft);color:var(--mut);border:4px dashed #D5D9EA;line-height:1.1;text-align:center}
.slot.filled{color:var(--ink);border-style:solid;border-color:var(--v);background:#F1EDFF}
.slot.ok{background:#DCFCE7;border:4px solid var(--g);color:var(--gd)}
.slot.ko{background:#FFE4E6;border:4px solid var(--r);color:var(--rd)}
.qcard.good{animation:goodflash .5s}
.qcard.shake{animation:shake .45s}
.tbar{position:absolute;left:20px;right:20px;bottom:11px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px}
.retry{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--y);color:#4a3200;font-weight:700;border-radius:999px;padding:4px 14px;font-size:15px;white-space:nowrap}
.retry.rev{background:#E0F2FE;color:#075985}
.praise{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:30px;font-weight:700;pointer-events:none;opacity:0;z-index:5;text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.praise.good{color:var(--gd)}.praise.combo{color:var(--od)}
.praise.show{animation:praise .75s ease-out}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(56px,8.6vh,76px);border-radius:18px;background:#fff;font-size:34px;font-weight:700;box-shadow:0 5px 0 #D6DAEA;color:var(--ink)}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #D6DAEA}
.key.del{background:#FFF1F2;color:var(--rd);box-shadow:0 5px 0 #F5C2C7}
.key.ok{background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{--c:var(--b);--d:var(--bd);height:clamp(96px,15vh,128px);border-radius:24px;font-size:clamp(40px,11vw,54px);font-weight:700;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d)}
.choice:nth-child(2){--c:var(--o);--d:var(--od)}.choice:nth-child(3){--c:var(--p);--d:var(--pd)}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.choice.ok{--c:var(--g);--d:var(--gd);animation:pop .4s}
.choice.ko{--c:#9AA0B8;--d:#757B94;animation:shake .4s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts.col{grid-template-columns:1fr}
.opt{min-height:100px;border-radius:22px;background:#fff;font-size:44px;font-weight:700;color:var(--ink);box-shadow:0 6px 0 #D6DAEA;border:4px solid transparent;padding:6px;line-height:1.1}

// ---------- Langues ----------
// Le français est la langue du code. Une autre langue se pose par-dessus au moment de l'affichage :
// chaque texte (ou phrase avec du gras) est cherché dans le dictionnaire de lang-xx.js ; s'il manque, il reste en français.
// Les nombres sont remplacés par # dans les clés : « Niveau 12 » se cherche sous « Niveau # ».
(function(){
  var L=window.MALINO_LANG||null;
  var I=window.I18N={lang:window.MLANG||'fr',on:!!L,D:L?L.D:{},R:L?L.R||[]:[],debug:false,miss:{},doneT:new WeakMap(),doneU:new WeakMap(),obs:null,
    NUM:/\d+(?:[.,]\d+)?/g,EMO:/(?:[0-9#*]\uFE0F?\u20E3|[\u{1F1E6}-\u{1F1FF}]{2}|\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*)/gu,LET:/[A-Za-zÀ-ÖØ-öø-ÿŒœ]{2}/,
    INL:{B:1,I:1,EM:1,STRONG:1,U:1,BR:1,SMALL:1,SUP:1,SUB:1},
    norm:function(s){return String(s).replace(/[\u00a0\u202f]/g,' ').replace(/'/g,'\u2019').replace(/\s+/g,' ').trim();},
    // traduction d'une chaîne ; null si elle n'est pas dans le dictionnaire
    text:function(s,kind){
      var n=this.norm(s);if(!n||n.length>1500)return null;
      var t=this.D[n];if(t!==undefined)return t;
      var nums=[],emo=[],key=n.replace(this.EMO,function(m){emo.push(m);return '¤';}).replace(this.NUM,function(m){nums.push(m);return '#';});
      t=this.D[key];
      if(t===undefined){
        if(!this.LET.test(n))return null;
        var r=this.rules(n);if(r!==null)return r;
        // majuscule au début : « Le chat » se cherche aussi sous « le chat »
        var c=n.charAt(0),lc=c.toLowerCase();
        if(c!==lc){var x=this.text(lc+n.slice(1),'c');if(x!==null)return x.charAt(0).toUpperCase()+x.slice(1);}
        if(this.debug&&kind!=='c'){var e=this.miss[key]||(this.miss[key]={n:0,k:kind||'t',s:this.src||''});e.n++;}
        return null;}
      var k=0,j=0;return t.replace(/#(\d)?/g,function(_,d){var v=d?nums[d-1]:nums[k++];return v===undefined?'':v;}).replace(/¤(\d)?/g,function(_,d){var v=d?emo[d-1]:emo[j++];return v===undefined?'':v;});},
    // règles : $1 recopie le morceau trouvé, %1 le traduit (s'il est inconnu, la règle ne s'applique pas), ~1 le traduit s'il est connu
    rules:function(n){var self=this;for(var i=0;i<this.R.length;i++){var r=this.R[i],m=r[0].exec(n);if(!m)continue;var ok=true;
        var out=r[1].replace(/%(\d)|\$(\d)|~(\d)/g,function(_,a,b,c){var g=m[a||b||c];if(g===undefined)g='';if(a||c){var x=self.text(g,'r');if(x===null){if(a&&self.LET.test(g))ok=false;return g;}return x;}return g;});
        if(ok)return out;}
      return null;},
    tr:function(s){var t=this.on?this.text(s,'js'):null;return t===null?s:t;},
    SKIP:{SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1},
    node:function(n){var v=n.nodeValue;if(!v||v.length>1500||this.doneT.get(n)===v)return;var pe=n.parentNode;if(pe&&(this.SKIP[pe.nodeName]||(pe.closest&&pe.closest('[lang=ar],[data-noi18n],script,style'))))return;
      var t=this.text(v,'t');if(t!==null){var a=/^\s*/.exec(v)[0],b=/\s*$/.exec(v)[0];t=a+t+b;if(t!==v)n.nodeValue=t;}
      this.doneT.set(n,n.nodeValue);},
    unit:function(el){var c=el.getElementsByTagName('*'),n=c.length;if(!n||n>10)return false;for(var i=0;i<n;i++){if(!this.INL[c[i].tagName]||c[i].attributes.length)return false;}return true;},
    attrs:function(el){var A=['placeholder','title','aria-label'];for(var i=0;i<3;i++){var v=el.getAttribute(A[i]);if(v){var t=this.text(v,'a');if(t!==null&&t!==v)el.setAttribute(A[i],t);}}},
    el:function(el){var ty=el.nodeType;if(ty===3)return this.node(el);if(ty!==1)return;
      var tag=el.tagName;if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='svg'||tag==='CANVAS'||tag==='NOSCRIPT')return;
      if(el.getAttribute('lang')==='ar'||el.hasAttribute('data-noi18n'))return;
      if(el.attributes.length)this.attrs(el);
      if(this.unit(el)){var h=el.innerHTML;if(this.doneU.get(el)===h)return;var x=this.LET.test(el.textContent)?this.text(h,'u'):null;
        if(x!==null){if(x!==h)el.innerHTML=x;this.doneU.set(el,el.innerHTML);return;}}
      for(var c=el.firstChild;c;c=c.nextSibling)this.el(c);},
    run:function(root){if(!this.on)return;this.el(root||document.body);if(this.obs)this.obs.takeRecords();},
    watch:function(){var self=this;this.obs=new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){var m=ms[i],p=m.target;
          if(m.type==='attributes'){if(p.nodeType===1)self.attrs(p);}
          else if(m.type==='characterData'){var q=p.parentNode;if(q&&q.nodeType===1&&self.unit(q))self.el(q);else self.el(p);}
          else if(p.nodeType===1&&p.isConnected){if(self.unit(p))self.el(p);else for(var j=0;j<m.addedNodes.length;j++){var a=m.addedNodes[j];if(a.isConnected)self.el(a);}}}
        self.obs.takeRecords();});
      this.obs.observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});},
    // voix, fenêtres de confirmation et titre de la page
    hook:function(){if(!this.on||this.hooked)return;this.hooked=true;var self=this;
      // la voix lit la traduction avec une voix anglaise ; un texte pas encore traduit n'est pas lu (plutôt le silence qu'une phrase en français)
      try{var sp=Voice.speak;Voice.speak=function(text,o){if(text&&!(o&&o.lang)){var t=self.text(text,'v');if(t===null){if(self.LET.test(String(text)))return;}else text=t;o=Object.assign({},o,{lang:'en-GB'});}return sp.call(Voice,text,o);};}catch(e){}
      ['confirm','alert','prompt'].forEach(function(f){var g=window[f];window[f]=function(m,d){return g.call(window,self.tr(m),d);};});
      document.title=this.tr(document.title);},
    set:function(l){try{localStorage.setItem('malino_lang',l);}catch(e){}var u=new URL(location.href);u.searchParams.delete('lang');location.replace(u.toString());}
  };
  if(I.on){I.watch();I.run(document.body);}
})();
</script>
<script>

// ---------- Outils ----------
const $=(s,el=document)=>el.querySelector(s);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=p<0?0:255,k=Math.abs(p)/100;r=Math.round((t-r)*k+r);g=Math.round((t-g)*k+g);b=Math.round((t-b)*k+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function starPath(cx,cy,R,inner){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?R*inner:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return d+'Z';}

// ---------- Textes ----------
const PRAISE=['Bravo !','Super !','Génial !','Trop fort !','Excellent !','Champion !','Waouh !','Parfait !','Bien joué !','Yes !'];

// ---------- Maths : niveaux ----------
function mk(a,op,b){const ans=op==='+'?a+b:op==='-'?a-b:op==='x'?a*b:10-a;return {key:a+op+b,a,op,b,ans};}
function addUpTo(m){const r=[];for(let a=1;a<m;a++)for(let b=1;a+b<=m;b++)r.push(mk(a,'+',b));return r;}
function subUpTo(m){const r=[];for(let a=2;a<=m;a++)for(let b=1;b<a;b++)r.push(mk(a,'-',b));return r;}
const MATH_LEVELS=[
 {e:'🌱',n:'Additions jusqu’à 5',gen:()=>addUpTo(5)},
 {e:'🌿',n:'Additions jusqu’à 7',gen:()=>addUpTo(7)},
 {e:'🌳',n:'Additions jusqu’à 10',gen:()=>addUpTo(10)},
 {e:'🔟',n:'Compléments à 10',gen:()=>{const r=[];for(let a=1;a<=9;a++)r.push(mk(a,'c',10));return r;}},
 {e:'👯',n:'Les doubles',gen:()=>{const r=[];for(let a=1;a<=10;a++)r.push(mk(a,'+',a));return r;}},
 {e:'🍃',n:'Soustractions jusqu’à 5',gen:()=>subUpTo(5)},
 {e:'🍂',n:'Soustractions jusqu’à 10',gen:()=>subUpTo(10)},
 {e:'🔀',n:'+ et − jusqu’à 10',gen:()=>addUpTo(10).concat(subUpTo(10))},
 {e:'🚀',n:'Additions jusqu’à 20',gen:()=>{const r=[];for(let a=2;a<=10;a++)for(let b=2;b<=10;b++)if(a+b>10)r.push(mk(a,'+',b));for(let b=1;b<=9;b++)r.push(mk(10,'+',b));return r;}},
 {e:'🛸',n:'Soustractions jusqu’à 20',gen:()=>{const r=[];for(let a=11;a<=18;a++)for(let b=2;b<=9;b++)if(a-b<10)r.push(mk(a,'-',b));for(let a=11;a<=19;a++)r.push(mk(a,'-',a-10));return r;}},
 {e:'🧱',n:'Les dizaines',gen:()=>{const r=[];for(let a=10;a<=80;a+=10)for(let b=10;a+b<=90;b+=10)r.push(mk(a,'+',b));for(let a=20;a<=90;a+=10)for(let b=10;b<a;b+=10)r.push(mk(a,'-',b));return r;}},
 {e:'💯',n:'Jusqu’à 100 sans retenue',gen:()=>{const r=[];for(let t=1;t<=8;t++)for(let u=0;u<=8;u++){const a=t*10+u;for(let b=1;u+b<=9;b++)r.push(mk(a,'+',b));for(let b=1;b<=u;b++)r.push(mk(a,'-',b));}return r;}},
 {e:'✌️',n:'Table de 2',gen:()=>{const r=[];for(let a=1;a<=10;a++)r.push(mk(a,'x',2));return r;}},
 {e:'🖐️',n:'Tables de 5 et de 10',gen:()=>{const r=[];for(let a=1;a<=10;a++){r.push(mk(a,'x',5));r.push(mk(a,'x',10));}return r;}},
 {e:'🔺',n:'Table de 3',t:6,gen:()=>{const r=[];for(let a=1;a<=10;a++)r.push(mk(a,'x',3));return r;}},
 {e:'🍀',n:'Table de 4',t:6,gen:()=>{const r=[];for(let a=1;a<=10;a++)r.push(mk(a,'x',4));return r;}},
 {e:'🧗',n:'Additions avec retenue (27 + 5)',t:7,gen:()=>{const r=[];for(let t=1;t<=8;t++)for(let u=3;u<=9;u++)for(let b=10-u;b<=9;b++)r.push(mk(t*10+u,'+',b));return mSample(r,40,71);}},
 {e:'⛏️',n:'Soustractions avec retenue (32 − 5)',t:7,gen:()=>{const r=[];for(let t=2;t<=9;t++)for(let u=0;u<=7;u++)for(let b=u+1;b<=9;b++)r.push(mk(t*10+u,'-',b));return mSample(r,40,72);}},
 {e:'🌀',n:'Tables de 2, 3, 4 et 5 mélangées',t:8,gen:()=>{const r=[];[2,3,4,5].forEach(b=>{for(let a=2;a<=10;a++)r.push(mk(a,'x',b));});return r;}},
 {e:'☄️',n:'Grandes additions (47 + 38)',t:9,gen:()=>{const r=[];for(let a=13;a<=69;a++)for(let b=12;b<=49;b++)if(a+b<=99&&a%10&&b%10)r.push(mk(a,'+',b));return mSample(r,40,73);}},
];
function mSample(arr,n,seed){const r=rng(seed);return rShuf(r,arr).slice(0,n);}
const _mf={};
const mathFacts=l=>_mf[l]||(_mf[l]=MATH_LEVELS[l-1].gen());
const OPS={'+':'+','-':'−','x':'×'},OPW={'+':'plus','-':'moins','x':'fois'};
const fQ=(f,slot)=>f.op==='c'?`${f.a} + ${slot} = 10`:`${f.a} ${OPS[f.op]} ${f.b} = ${slot}`;
const fFull=f=>f.op==='c'?`${f.a} + ${f.ans} = 10`:`${f.a} ${OPS[f.op]} ${f.b} = ${f.ans}`;

 s:{ex:'serpent',e:'🐍'},m:{ex:'moto',e:'🏍️'},l:{ex:'lion',e:'🦁'},r:{ex:'rat',e:'🐀'},f:{ex:'feu',e:'🔥'},n:{ex:'nez',e:'👃'},v:{ex:'vélo',e:'🚲'},ch:{ex:'chat',e:'🐱'},j:{ex:'jus',e:'🧃'},z:{ex:'zèbre',e:'🦓'},p:{ex:'pomme',e:'🍎'},t:{ex:'tortue',e:'🐢'},b:{ex:'ballon',e:'🎈'},d:{ex:'dé',e:'🎲'},k:{ex:'kiwi',e:'🥝'},g:{ex:'gâteau',e:'🎂'}};

function chgItems(seed,n,count,kinds,base,per){const r=rng(seed),out=[];

const f1=v=>Math.round(v*10)/10;

function clockSVG(h,m,sz){const a=((h%12)+m/60)*30,b=m*6;let t='',tk='';
  for(let i=1;i<=12;i++){const g=i*Math.PI/6;t+=`<text x="${f1(50+35*Math.sin(g))}" y="${f1(54.5-35*Math.cos(g))}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2B2160" font-family="Fredoka,sans-serif">${i}</text>`;}
  for(let i=0;i<60;i++){const g=i*Math.PI/30,r0=i%5?43:41;tk+=`<line x1="${f1(50+r0*Math.sin(g))}" y1="${f1(50-r0*Math.cos(g))}" x2="${f1(50+45.5*Math.sin(g))}" y2="${f1(50-45.5*Math.cos(g))}" stroke="${i%5?'#CFC9E6':'#7B5CFF'}" stroke-width="${i%5?1:2}"/>`;}
  const hand=(ang,len,w,col)=>{const g=ang*Math.PI/180;return `<line x1="50" y1="50" x2="${f1(50+len*Math.sin(g))}" y2="${f1(50-len*Math.cos(g))}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;};
  return `<svg viewBox="0 0 100 100" class="clk" style="width:${sz||150}px;height:${sz||150}px" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#7B5CFF" stroke-width="3.5"/>${tk}${t}${hand(a,23,5.5,'#2563EB')}${hand(b,36,3.2,'#EF4444')}<circle cx="50" cy="50" r="3.8" fill="#2B2160"/></svg>`;}
const hTxt=(h,m)=>m?`${h} h ${pad2(m)}`:`${h} h`;
const hSay=(h,m)=>{const H=x=>x===12?'midi':x===0||x===24?'minuit':x+(x>1?' heures':' heure');if(!m)return H(h);if(m===30&&h<=12)return H(h)+' et demie';if(m===15&&h<=12)return H(h)+' et quart';if(m===45&&h<=12)return H(h===12?1:h+1)+' moins le quart';return H(h)+' '+m;};
const hAdd=(h,m,d)=>{let t=h*60+m+d;t=((t%720)+720)%720;let H=Math.floor(t/60),M=t%60;if(H===0)H=12;return [H,M];};

function paceOf(sub,lv){
  const ss=S.sessions.filter(s=>s.type===sub&&s.lvl===lv&&s.n>=4).slice(-2),n=ss.reduce((a,s)=>a+s.n,0);

function wPick(arr,w){let tot=0;const ws=arr.map(x=>{const v=w(x);tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
// File de questions : quelques calculs « focus » répétés 2 fois + révisions pondérées par la faiblesse
function buildQueue(items,n,wfn){
  const scored=items.map(it=>({it,s:wfn(it.key)*(.6+Math.random()*.8)})).sort((a,b)=>b.s-a.s);
  const focusN=Math.min(items.length,Math.max(2,Math.round(n/3)));
  let out=[];scored.slice(0,focusN).forEach(x=>out.push(x.it,x.it));
  let pool=scored.slice(focusN).map(x=>x.it);
  while(out.length<n){if(!pool.length)pool=items.slice();const p=wPick(pool,it=>wfn(it.key));out.push(p);pool.splice(pool.indexOf(p),1);}
  out=shuffle(out.slice(0,n));
  for(let i=1;i<out.length;i++){if(out[i].key===out[i-1].key){for(let j=i+1;j<out.length;j++){if(out[j].key!==out[i].key&&(j+1>=out.length||out[j+1].key!==out[i].key)&&out[j-1].key!==out[i].key){[out[i],out[j]]=[out[j],out[i]];break;}}}}
  return out;
}

  nb(){const a=S.album||{};return ALBUM.filter(x=>a[x.id]).length;},

  apresPartie(sess){if(!sess||sess.type==='sprint'||!this.on())return null;const d=dayKey();if(!S.cofG||S.cofG.d!==d)S.cofG={d,n:0};if(S.cofG.n>=3)return null;
    const ch=sess.stars===3?.55:sess.stars===2?.2:0;if(Math.random()>=ch)return null;
    const c=this.gagne(wPick(['bois','argent','or','epique'],k=>({bois:55,argent:30,or:12,epique:3})[k]),'partie');if(c)S.cofG.n++;return c;},

  open(id){const c=this.list().find(x=>x.id===id);if(!c)return;if(!this.ready(c)){Sound.play('tap');toast(`⏳ Encore ${this.left(c)} avant de l’ouvrir`);return;}

  reveal(id){const l=this.list(),i=l.findIndex(x=>x.id===id);if(i<0)return nextModal();const c=l[i];l.splice(i,1);S.stats.coffres=(S.stats.coffres||0)+1;
    const T=COFT[c.t],roll=Math.random()*100,kind=roll<T.p[0]?'farce':roll<T.p[0]+T.p[1]?'bon':'epique';let coins=0,g=null,item=null,html='';
    if(kind==='farce'){g=this.colle(pick(ALBUM.filter(a=>a.r==='f')).id);coins=cc(3)+g.bonus;
      html=`<div class="cofres farce"><div class="bigemoji wob">${g.a.e}</div><span class="rtag" style="background:#9A8478">Farce !</span><h2>Oh non… ${esc(g.a.n.toLowerCase())} !</h2><p>Ça arrive ! Elle rejoint ta collection des farces 😄</p>${g.dup?'':'<p class="cofnote">Nouvelle farce dans ton album 📒</p>'}<div class="gainline">+${fmtP(coins)} 🪙</div></div>`;}
    else if(kind==='bon'){coins=cc(Math.round(rand(15,30)*T.m));if(Math.random()<.6){g=this.colle(pick(ALBUM.filter(a=>a.r===(Math.random()<.75?'c':'r'))).id);coins+=g.bonus;}

    else{coins=cc(Math.round(rand(40,80)*T.m));const rng2={bois:[200,1500],argent:[300,2500],or:[600,5000],epique:[1500,12000],legende:[4000,30000]}[c.t];
      if(c.t==='legende'||Math.random()<.45)item=dropItem(rng2[0],rng2[1],true);

      html=`<div class="cofres epiq"><div class="cofopen">${chestSVG(c.t,true)}</div><span class="rtag rainbow">Épique !</span><h2>+${fmtP(coins)} 🪙</h2>${item?`<p>Et un objet rare : <b>${esc(item.name)}</b> !</p><div class="mav">${thumb(item)}</div>`:this.stk(g)}</div>`;}
    S.coins+=coins;save();
    const btn=item?`<div class="stack"><button class="btn p block" data-act="equipgift" data-arg="${item.id}">Le mettre tout de suite</button><button class="btn y block" data-act="mclose">Super !</button></div>`:`<button class="btn ${kind==='farce'?'w':'y'} block" data-act="mclose">${kind==='farce'?'Tant pis 😅':'Super !'}</button>`;
    $('#modal .mbox').innerHTML=html+btn;
    if(kind==='farce'){Sound.play(Sound.custom('fail').length?'fail':'bad');Sons.farce();if(S.settings.voice)Voice.say('Oh non ! '+g.a.n+' !');}
    else if(kind==='bon'){Sound.play('level');Sons.bon();Confetti.burst(110);if(S.settings.voice)Voice.say(`Bravo ! Tu gagnes ${coins} pièces${g&&!g.dup?' et un nouvel autocollant':''} !`);}
    else{Sound.play('epic');Confetti.burst(220);setTimeout(()=>Sons.exc(),300);setTimeout(()=>Confetti.burst(160,innerWidth*.25,innerHeight*.3),500);setTimeout(()=>Confetti.burst(160,innerWidth*.75,innerHeight*.3),900);if(S.settings.voice)Voice.say(item?'Coffre épique ! Tu gagnes un objet rare !':'Coffre épique ! Un autocollant rare !');}
    if(g&&g.serie)setTimeout(()=>Sons.exc(),700);checkBadges(null).forEach(badgeModal);if(SCR==='home')render();},
  slotsHTML(){if(!this.on())return '';const l=this.list();let h='';
    for(let i=0;i<COF_SLOTS;i++){const c=l[i];h+=c?`<button class="cslot t-${c.t} ${this.ready(c)?'ready':''}" data-act="cofopen" data-arg="${c.id}" aria-label="${COFT[c.t].n}">${chestSVG(c.t)}<small data-cof="${c.ready}">${this.ready(c)?'Ouvrir !':'⏳ '+this.left(c)}</small></button>`:'<div class="cslot empty"><span>＋</span><small>Libre</small></div>';}
    return `<div class="cofs card"><div class="cofh"><b>🗝️ Mes coffres</b><button class="cofalb" data-act="album">📒 Album ${this.nb()}/${ALBUM.length}</button></div><div class="cslots">${h}</div>${l.length?'':'<p class="cofhint">Gagne des coffres en jouant : 3 étoiles, nouveau niveau, mission du jour… Ils s’ouvrent au bout de 12 h.</p>'}</div>`;},
  // met à jour les comptes à rebours ; prévient quand un coffre devient prêt

  async check(){let st='off';try{if(!this.sup())st='nosup';else{const r=await navigator.serviceWorker.ready,s=await r.pushManager.getSubscription();st=s&&Notification.permission==='granted'?'on':Notification.permission==='denied'?'denied':'off';}}catch(e){}const ch=st!==this.st;this.st=st;if(ch&&SCR==='admin')keepScroll(render);return st;},

// Beaucoup de téléphones n'ont pas de voix arabe : chaque lettre et chaque mot a son fichier (ar/<empreinte>.mp3).

  key(t){let h=0x811c9dc5;t=String(t);for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return ('0000000'+h.toString(16)).slice(-8);},
  load(t){if(this.buf[t])return this.buf[t];Sound.unlock();const c=Sound.ctx;if(!c)return Promise.resolve(null);
    const p=fetch('ar/'+this.key(t)+'.mp3').then(r=>r.ok?r.arrayBuffer():null).then(a=>a?new Promise((ok,ko)=>c.decodeAudioData(a,ok,ko)):null).then(b=>{p.b=b;return b;}).catch(()=>{delete this.buf[t];return null;});
    return this.buf[t]=p;},
  dur(t){const p=this.buf[t];return p&&p.b?p.b.duration:0;},
  stop(){const k=this.cur;this.cur=null;if(k)try{k.stop();}catch(e){}},
  async play(t){const my=this.tok=(this.tok||0)+1;const b=await this.load(t);if(my!==this.tok)return;
    if(!b){if(Voice.ar)Voice.native(t,{lang:'ar-SA',rate:.75});return;}
    const c=Sound.ctx;if(c.state==='suspended')try{c.resume();}catch(e){}
    this.stop();const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=1;s.connect(g);g.connect(c.destination);s.start();this.cur=s;s.onended=()=>{if(this.cur===s)this.cur=null;};},
  preload(list){(list||[]).forEach(t=>{if(t)this.load(t);});}
};
// ---------- Voix (synthèse vocale du navigateur) ----------
const Voice={v:null,ok:'speechSynthesis' in window,warm:false,t:0,cur:null,
  init(){if(!this.ok)return;const pv=()=>{const all=speechSynthesis.getVoices();this.n=all.length;this.ar=all.find(v=>/^ar[-_]SA/i.test(v.lang))||all.find(v=>/^ar/i.test(v.lang))||null;const es=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));this.en=es.find(v=>/en[-_]GB/i.test(v.lang))||es.find(v=>/en[-_]US/i.test(v.lang))||es[0]||null;const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));this.v=vs.find(v=>/fr[-_]FR/i.test(v.lang)&&/google|amélie|amelie|audrey|thomas|marie|hortense|denise|julie/i.test(v.name))||vs.find(v=>/fr[-_]FR/i.test(v.lang))||vs[0]||null;};pv();try{speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',pv):(speechSynthesis.onvoiceschanged=pv);}catch(e){}},
  unlock(){Rec.unlock();if(!this.ok||this.warm)return;this.warm=true;try{const u=new SpeechSynthesisUtterance(' ');u.lang='fr-FR';u.volume=0;speechSynthesis.speak(u);}catch(e){}},
  busy(){try{return this.ok&&(speechSynthesis.speaking||speechSynthesis.pending);}catch(e){return false;}},
  speak(text,o){o=o||{};if(text&&/^ar/i.test(o.lang||'')){ArAudio.play(text);return;}this.native(text,o);},
  native(text,o){if(!this.ok||!text)return;o=o||{};try{const u=new SpeechSynthesisUtterance(text);const isAr=/^ar/i.test(o.lang||'');if(isAr&&!this.ar&&this.n)return;u.lang=o.lang||'fr-FR';const vv=isAr?this.ar:o.lang?this.en:this.v;if(vv)u.voice=vv;u.rate=o.rate||.9;u.pitch=1.05;u.volume=1;this.cur=u;if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}},
  hush(){clearTimeout(this.t);ArAudio.stop();try{if(this.busy())speechSynthesis.cancel();}catch(e){}},
  // Annuler puis parler immédiatement fait taire certains navigateurs : on laisse 90 ms entre les deux

const estMs=(t,r)=>Math.round((320+String(t).length*72)/(r||.9));
// Enchaîne voix, sons enregistrés et effets visuels (ex. « s… e… se »)
const Chain={t:[],
  run(steps,done){Voice.stop();let at=Voice.busy()?120:30;const add=(fn,d)=>this.t.push(setTimeout(fn,d));
    (steps||[]).forEach(st=>{if(!st)return;if(st.fn)add(st.fn,at);else if(st.say){const tx=st.say,r=st.rate,lg=st.lang;add(()=>Voice.speak(tx,{rate:r,lang:lg}),at);const ad=/^ar/i.test(lg||'')?ArAudio.dur(tx):0;at+=ad?Math.round(ad*1000)+250:estMs(tx,r);}else if(st.rec){const k=st.rec;add(()=>Rec.play(k),at);at+=1050;}else if(st.wait)at+=st.wait;});

// Sons enregistrés par les parents (stockés sur l'appareil)
const Rec={key:'supercerveau_sons',map:{},el:null,unlocked:false,rec:null,

  play(k){const r=this.map[k];if(!r)return;try{if(!this.el)this.el=new Audio();this.el.src=r.d;const p=this.el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}},

  async record(k,cb){
    if(this.rec)return;

    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Micro refusé : autorisez le micro pour ce site');return;}
    const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'],mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';

const Confetti={cv:null,cx:null,p:[],on:false,
  init(){this.cv=$('#confetti');this.cx=this.cv.getContext('2d');const rs=()=>{const r=window.devicePixelRatio||1;this.cv.width=innerWidth*r;this.cv.height=innerHeight*r;this.cx.setTransform(r,0,0,r,0,0);};rs();addEventListener('resize',rs);},
  burst(n,x,y){n=n||100;x=x==null?innerWidth/2:x;y=y==null?innerHeight*.35:y;if(matchMedia('(prefers-reduced-motion: reduce)').matches)n=Math.min(n,20);const cols=['#FF5A64','#FFC83D','#22C55E','#2EA3FF','#7B5CFF','#FF6FB5','#FF9A1F'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*9;this.p.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,w:6+Math.random()*6,h:8+Math.random()*8,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0,max:80+Math.random()*60});}if(!this.on){this.on=true;requestAnimationFrame(()=>this.tick());}},
  tick(){const cx=this.cx;cx.clearRect(0,0,innerWidth,innerHeight);this.p=this.p.filter(q=>q.life<q.max&&q.y<innerHeight+40);for(const q of this.p){q.life++;q.vy+=.28;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;cx.save();cx.translate(q.x,q.y);cx.rotate(q.r);cx.globalAlpha=Math.max(0,1-q.life/q.max);cx.fillStyle=q.c;cx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cx.restore();}if(this.p.length)requestAnimationFrame(()=>this.tick());else{this.on=false;cx.clearRect(0,0,innerWidth,innerHeight);}}

 moyens:['houngoungagne','sus','among_us2','mario_die','mama_mia','montagem','acelerada','spiderman'],
 musiques:['auraaa','aura_imran','aura_slowed','dragonball_cell','dragonball','sonic_invincible','mgs2','cod141','among_us_long']};
const SONS_POOL={
 exc:['auraaa','aura_imran','aura_slowed'],                                   // moments exceptionnels : palier ×10, coffre épique, série d'album, badge légendaire
 pal:['dragonball_cell','dragonball','sonic_invincible','mgs2','cod141'],     // paliers intermédiaires : ×5, nouveau jeu, monde, badge épique
 lvl:['mario_bros','arcade','sonic_bubble','spiderman'],                       // montée de niveau ordinaire
 bon:['mario_pipe','arcade','mario_bros','sonic_bubble'],                      // coffre sympa
 farce:['augh','omaiga','amogus','sus','splat','mama_mia','mario_die','flashbang'],
 combo:['cod_warzone','headshot','ok'],
 record:['suiii','ronaldo','houngoungagne']};
const Sons={buf:{},cur:null,tk:0,
  url:n=>SB_URL+'/storage/v1/object/public/cris/sons/'+n+'.mp3',
  ok(){return !!(S&&S.settings.sound&&S.settings.sndMode==='max');},
  pick(k){const a=SONS_POOL[k];let n;do{n=a[Math.floor(Math.random()*a.length)];}while(a.length>1&&n===this.last);return this.last=n;},
  async load(n){if(this.buf[n])return this.buf[n];Sound.unlock();const c=Sound.ctx;if(!c)return null;
    try{const r=await fetch(this.url(n));if(!r.ok)return null;const a=await r.arrayBuffer();return this.buf[n]=await new Promise((ok,ko)=>c.decodeAudioData(a,ok,ko));}catch(e){return null;}},
  // arrêt en douceur (fondu), jamais sec
  stop(f){const k=this.cur;this.tk++;if(!k)return;this.cur=null;f=f||.4;try{const c=Sound.ctx,t=c.currentTime,g=k.g.gain;g.cancelScheduledValues(t);g.setValueAtTime(Math.max(g.value,.0001),t);g.linearRampToValueAtTime(.0001,t+f);k.s.stop(t+f+.03);}catch(e){}},
  // max = durée maxi en secondes (0 = en entier) ; fade = durée du fondu final
  async play(n,o){o=o||{};if(!this.ok())return;const my=++this.tk;this.stopSoft();const b=await this.load(n);if(!b||my!==this.tk||!this.ok())return;
    const c=Sound.ctx;if(c.state==='suspended')try{c.resume();}catch(e){}
    const s=c.createBufferSource(),g=c.createGain(),vol=o.vol||.8,t=c.currentTime+.02,d=o.max?Math.min(o.max,b.duration):b.duration,fade=Math.min(o.fade||1,d/2);
    s.buffer=b;s.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(d>8?.25:.04));
    if(d<b.duration||d>8){g.gain.setValueAtTime(vol,t+d-fade);g.gain.linearRampToValueAtTime(.0001,t+d);s.stop(t+d+.03);}
    this.cur={s,g};s.onended=()=>{if(this.cur&&this.cur.s===s)this.cur=null;};s.start(t);},
  stopSoft(){const k=this.cur;if(!k)return;this.cur=null;try{const c=Sound.ctx,t=c.currentTime,g=k.g.gain;g.cancelScheduledValues(t);g.setValueAtTime(Math.max(g.value,.0001),t);g.linearRampToValueAtTime(.0001,t+.15);k.s.stop(t+.18);}catch(e){}},
  exc(){this.play(this.pick('exc'),{max:14,fade:1.2});},
  pal(){this.play(this.pick('pal'),{max:8,fade:1});},
  lvl(){this.play(this.pick('lvl'),{max:5,fade:.5});},
  bon(){this.play(this.pick('bon'),{max:3,fade:.4});},
  farce(){this.play(this.pick('farce'),{max:4,fade:.4});},
  combo(n){if(n===10||(n>10&&n%25===0))this.play(this.pick('combo'),{max:2.5,fade:.4,vol:.7});},
  record(){this.play(this.pick('record'),{max:3.5,fade:.5});}};

function aggDays(list){const m={};list.forEach(s=>{const x=m[s.d]||(m[s.d]={d:s.d,n:0,ok:0,t:0,tn:0});x.n+=s.n||0;x.ok+=s.ok||0;if(s.avgMs){x.t+=s.avgMs*(s.ok||1);x.tn+=(s.ok||1);}});return Object.values(m).sort((a,b)=>a.d<b.d?-1:1).slice(-30).map(x=>({d:x.d,acc:x.n?x.ok/x.n:0,avg:x.tn?x.t/x.tn:0}));}
function lineChart(pts,o){
  if(!pts.length)return '<div class="empty">Pas encore de données : la courbe apparaîtra après les premières parties.</div>';
  const W=340,H=170,L=44,R=14,T=18,B=24,iw=W-L-R,ih=H-T-B,y0=o.yMin||0,y1=o.yMax;
  const X=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>T+ih-(Math.min(Math.max(v,y0),y1)-y0)/(y1-y0)*ih;
  let g='';[0,.5,1].forEach(f=>{const v=y0+(y1-y0)*f,y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E7E9F3" stroke-width="1"/><text x="${L-6}" y="${+y+4}" text-anchor="end" class="ax">${o.fmt(v)}</text>`;});
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="${o.color}" stroke="#fff" stroke-width="2"/>`).join('');
  const hits=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" fill="transparent" data-tip="${esc((p.tip||p.lab)+' : '+o.fmt(p.y))}"/>`).join('');
  const last=pts[pts.length-1],lx=X(pts.length-1),ly=Math.max(12,Y(last.y)-10);
  const xl=`<text x="${X(0).toFixed(1)}" y="${H-5}" text-anchor="${pts.length===1?'middle':'start'}" class="ax">${esc(pts[0].lab)}</text>`+(pts.length>1?`<text x="${lx.toFixed(1)}" y="${H-5}" text-anchor="end" class="ax">${esc(last.lab)}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||'')}">${g}${pts.length>1?`<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}<text x="${Math.min(lx+4,W-2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end" class="vl">${o.fmt(last.y)}</text>${xl}${hits}</svg>`;
}
function factMap(lv){
  const facts=mathFacts(lv);let list=facts,note='';
  if(facts.length>120){list=facts.filter(f=>S.facts[f.key]&&S.facts[f.key].n);note=`<p class="hint">${facts.length} calculs dans ce monde : seuls ceux déjà vus sont affichés.</p>`;}
  if(!list.length)return note+'<div class="empty">Aucun calcul vu pour l’instant.</div>';
  return note+`<div class="chips">${list.map(f=>{const s=S.facts[f.key],tip=s&&s.n?`${fFull(f)} · vu ${s.n} fois · ${s.ok} juste${s.ok>1?'s':''}${s.ms?' · '+sec(s.ms):''}`:`${fFull(f)} · pas encore vu`;return `<span class="chip ${factStatus(s)}" data-tip="${esc(tip)}">${esc(fShort(f))}</span>`;}).join('')}</div>`;
}
function weakList(){
  const m=new Map();MATH_LEVELS.forEach((L,i)=>mathFacts(i+1).forEach(f=>{const s=S.facts[f.key];if(s&&s.err&&s.st<3&&!m.has(f.key))m.set(f.key,{f,s});}));
  const arr=[...m.values()].sort((a,b)=>(b.s.err-b.s.ok*.3)-(a.s.err-a.s.ok*.3)).slice(0,8);
  if(!arr.length)return '<div class="empty">Rien à signaler 👍</div>';
  return arr.map(({f,s})=>`<div class="weak"><span class="chip weak">${esc(fShort(f))}</span><span>${s.err} erreur${s.err>1?'s':''} · ${s.ok} juste${s.ok>1?'s':''}${s.ms?' · '+sec(s.ms):''}</span></div>`).join('');
}

// ---------- Temps de jeu actif (ne compte ni l'écran éteint, ni l'appli laissée ouverte) ----------
const fmtDur=s=>{const m=Math.floor(s/60);return m<1?(s>0?'< 1 min':'0 min'):m<60?m+' min':Math.floor(m/60)+' h '+pad2(m%60);};
const TimeT={last:0,acc:{m:0,f:0,o:0},n:0,cont:0,lastAct:0,tipped:false,
  touch(){this.last=Date.now();},
  d(k){k=k||dayKey();const x=(S.time&&S.time[k])||{},a=k===dayKey()?this.acc:{m:0,f:0,o:0};return {m:(x.m||0)+a.m,f:(x.f||0)+a.f,o:(x.o||0)+a.o};},
  tot(d){return d.m+d.f+d.o;},
  sec(k){return this.tot(this.d(k));},
  weekKeys(){const d=new Date(),mon=addDays(d,-((d.getDay()+6)%7));return Array.from({length:7},(_,i)=>dayKey(addDays(mon,i)));},
  weekSec(){return this.weekKeys().reduce((a,k)=>a+this.sec(k),0);},
  weekDays(min){return this.weekKeys().filter(k=>this.sec(k)>=min).length;},
  all(c){let t=0;Object.keys(S.time||{}).forEach(k=>{if(k!==dayKey()){const x=S.time[k];t+=c?(x[c]||0):(x.m||0)+(x.f||0)+(x.o||0);}});const d=this.d();return t+(c?d[c]:this.tot(d));},
  tick(){
    if(document.visibilityState!=='visible'||SCR==='admin'||!$('#auth').classList.contains('hidden')||!$('#onb').classList.contains('hidden'))return;
    const now=Date.now();if(now-this.last>(SCR==='game'?40000:20000))return;
    this.acc[SCR==='game'&&G?(G.sub==='math'?'m':G.sub==='fr'?'f':'o'):'o']++;
    if(now-this.lastAct>300000){this.cont=0;this.tipped=false;}this.lastAct=now;this.cont++;
    if(++this.n>=30)this.flush();
  },
  flush(){const a=this.acc;this.n=0;if(!(a.m+a.f+a.o))return;if(!S.time)S.time={};const k=dayKey(),d=S.time[k]||(S.time[k]={m:0,f:0,o:0});d.m=(d.m||0)+a.m;d.f=(d.f||0)+a.f;d.o=(d.o||0)+a.o;this.acc={m:0,f:0,o:0};
    const ks=Object.keys(S.time).sort();while(ks.length>120)delete S.time[ks.shift()];save();},
  init(){['pointerdown','keydown'].forEach(e=>document.addEventListener(e,()=>this.touch(),{passive:true,capture:true}));setInterval(()=>this.tick(),1000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')this.flush();});window.addEventListener('pagehide',()=>this.flush());},
  limited(){const dl=+S.settings.dayLimit||0;return dl>0&&this.sec()>=dl*60;}
};
function timeChart(){
  const ks=Array.from({length:14},(_,i)=>dayKey(addDays(new Date(),i-13))),D=ks.map(k=>TimeT.d(k)),mxM=Math.max(10,Math.ceil(Math.max(...D.map(d=>TimeT.tot(d)))/300)*5),W=320,H=118,L=30,bw=13,step=(W-L-bw-4)/13,C={m:'#2EA3FF',f:'#7B5CFF',o:'#FF9A1F'},N={m:'maths',f:'lecture',o:'autres jeux'},JS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  const y=s=>H-(s/60)/mxM*(H-8);
  let g=[0,mxM/2,mxM].map(v=>`<line x1="${L}" x2="${W}" y1="${y(v*60)}" y2="${y(v*60)}" stroke="#E9E6F5" stroke-width="1"/><text x="${L-5}" y="${y(v*60)+3.5}" font-size="9.5" text-anchor="end" fill="#9094AE">${v%1?v.toFixed(1).replace('.',','):v}</text>`).join('');
  ks.forEach((k,i)=>{const d=D[i],x=L+4+i*step;let base=0,segs='';['m','f','o'].forEach(c=>{if(d[c]<30)return;const h=(d[c]/60)/mxM*(H-8),hh=Math.max(2,h-(base?2:0));segs+=`<rect x="${x}" y="${H-base-h}" width="${bw}" height="${hh}" rx="3" fill="${C[c]}"/>`;base+=h;});
    const dt=new Date(k+'T12:00:00'),tip=`${JS[dt.getDay()]} ${fmtD(k)} : ${fmtDur(TimeT.tot(d))}`+(TimeT.tot(d)>=60?` (${['m','f','o'].filter(c=>d[c]>=30).map(c=>N[c]+' '+fmtDur(d[c])).join(', ')})`:'');
    g+=`<g><title>${tip}</title><rect x="${x-3}" y="0" width="${bw+6}" height="${H+14}" fill="transparent"/>${segs||`<rect x="${x}" y="${H-1.5}" width="${bw}" height="1.5" rx=".75" fill="#D9D5EA"/>`}<text x="${x+bw/2}" y="${H+12}" font-size="9" text-anchor="middle" fill="${i===13?'#24263A':'#9094AE'}" font-weight="${i===13?700:400}">${i===13?'auj.':i%2?fmtD(k).slice(0,2):''}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Temps de jeu actif par jour, en minutes, sur 14 jours" style="width:100%;height:auto;display:block">${g}</svg><div class="tleg"><span><i style="background:${C.m}"></i>Maths</span><span><i style="background:${C.f}"></i>Lecture</span><span><i style="background:${C.o}"></i>Autres jeux</span><small>minutes par jour</small></div>`;
}
function timeSection(){
  const wk=TimeT.weekKeys(),ws=TimeT.weekSec(),wd=TimeT.weekDays(60),agg={m:0,f:0,o:0};wk.forEach(k=>{const d=TimeT.d(k);agg.m+=d.m;agg.f+=d.f;agg.o+=d.o;});
  const ks=Array.from({length:14},(_,i)=>dayKey(addDays(new Date(),i-13))).map(k=>TimeT.sec(k)).filter(s=>s>=60),avg=ks.length?ks.reduce((a,b)=>a+b,0)/ks.length:0;
  const top=ws>=120?Object.entries(agg).sort((a,b)=>b[1]-a[1])[0][0]:'',dl=+S.settings.dayLimit||0;
  return `<section class="acard"><h3>🕒 Temps de jeu</h3><p class="hint">Seul le temps où ${nm()} joue vraiment est compté : pas l’écran éteint, ni l’appli laissée ouverte sans y toucher.</p>
  <div class="tiles"><div class="tile"><b>${fmtDur(TimeT.sec())}</b><small>aujourd’hui${dl?` · limite ${dl} min`:''}</small></div><div class="tile"><b>${fmtDur(ws)}</b><small>cette semaine</small></div><div class="tile"><b>${fmtDur(Math.round(avg))}</b><small>par jour joué</small></div></div>
  ${ws>=60?`<p class="hint" style="margin-top:8px">Cette semaine : <b>${fmtDur(ws)}</b> sur ${wd} jour${wd>1?'s':''}${top?`, surtout ${{m:'en maths',f:'en lecture',o:'sur les autres jeux'}[top]}`:''}.</p>`:''}
  ${Plan.kind()==='gratuit'?`<p class="hint" style="margin-top:8px">📊 Le graphique jour par jour est inclus dans Malino+. <button class="alink" style="display:inline;margin:0;padding:0" data-act="offre" data-arg="temps">Débloquer</button></p>`:timeChart()}</section>`;
}

    e.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{e.style.display='none';Sound.play('tap');Acct.switchTo(b.dataset.who);});
    e.querySelector('[data-wparent]').onclick=()=>{e.style.display='none';ACT.parent();};
  },
  afterRefresh(){ if(Acct.user&&localStorage.getItem('malino_invite'))this.handleInvite(); else this.who(); },
  async handleInvite(){
    const id=localStorage.getItem('malino_invite');if(!id||!Acct.sb)return;
    const {data,error}=await Acct.sb.rpc('famille_apercu',{p_token:id});
    if(error||!data)return;
    const a=data;if(a.etat==='connexion')return;
    this._a=a;
    if(a.etat!=='ok'){
      localStorage.removeItem('malino_invite');
      const m={deja:'Vous avez déjà rejoint cet espace.',soi:'Cette invitation est la vôtre.',expire:'Cette invitation a expiré. Demandez-en une nouvelle.',complet:'Cet espace a déjà deux parents.',jai_un_coparent:'Vous suivez déjà un autre espace. Quittez-le avant de rejoindre celui-ci.',abonnement:"Vous avez un abonnement Malino+ actif. Résiliez-le avant de rejoindre cet espace.",invalide:"Cette invitation n'est plus valable."}[a.etat]||'Invitation indisponible.';
      queueModal(`<div class="bigemoji sm">👨‍👩‍👧</div><h2>Espace famille</h2><p>${esc(m)}</p><button class="btn block" data-act="mclose">OK</button>`);return;
    }
    const enfants=(a.enfants||[]).length?(a.enfants||[]).map(esc).join(', '):'vos enfants';
    queueModal(`<div class="bigemoji sm">👨‍👩‍👧</div><h2>Rejoindre l'espace famille</h2><p><b>${esc(a.proprio)}</b> vous invite à suivre ensemble ${enfants}, avec les mêmes profils et le même suivi.</p><button class="btn p block" id="fjoin">Rejoindre</button><button class="alink" data-act="mclose">Plus tard</button>`,()=>{const b=$('#fjoin');if(b)b.onclick=()=>this.join(id,false);});
  },
  async join(id,sup){
    const {data,error}=await Acct.sb.rpc('famille_rejoindre',{p_token:id,p_supprimer:!!sup});
    if(error||!data)return toast('Réessayez dans un instant');
    nextModal();
    if(data.etat==='confirmer'){
      const a=this._a||{},liste=(a.a_supprimer||[]).length?` (${(a.a_supprimer||[]).map(esc).join(', ')})`:'';
      queueModal(`<div class="bigemoji sm">⚠️</div><h2>Votre compte actuel sera supprimé</h2><p>Pour rejoindre cet espace, votre compte actuel et ses profils seront supprimés${liste}. C'est irréversible.</p><button class="btn r block" id="fjoin2">Supprimer et rejoindre</button><button class="alink" data-act="mclose">Annuler</button>`,()=>{const b=$('#fjoin2');if(b)b.onclick=()=>this.join(id,true);});
      return;
    }
    if(data.etat==='rejoint'){
      localStorage.removeItem('malino_invite');this._a=null;
      toast('Bienvenue dans l’espace famille ✅');
      await Acct.afterLogin(false);await Plan.refresh(true);render();return;
    }
    toast('Invitation indisponible');
  }
};

<script>
// Plein écran au premier toucher : Chrome Android masque alors sa barre du haut (retour possible via les réglages du navigateur)
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
  if(standalone)return;
  function go(){
    var el=document.documentElement;
    if(document.fullscreenElement||!el.requestFullscreen)return;
    el.requestFullscreen({navigationUI:'hide'}).catch(function(){});
  }
  document.addEventListener('pointerdown',go,{once:true,passive:true});
})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SuperCerveau">
<title>SuperCerveau · Maths & Lecture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#7B5CFF;--vd:#5A3BE0;--g:#22C55E;--gd:#16A34A;--r:#FF5A64;--rd:#E03A45;
  --y:#FFC83D;--yd:#E5A500;--b:#2EA3FF;--bd:#1679D1;--o:#FF9A1F;--od:#D97A00;
  --p:#FF6FB5;--pd:#D94C93;--ink:#24263A;--ink2:#565B76;--mut:#9AA0B8;
  --card:#fff;--line:#E7E9F3;--soft:#F4F5FB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:#E9E0FF}
body{font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:linear-gradient(170deg,#BFE6FF 0%,#E3DAFF 55%,#FFE3F1 100%) fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
input,select,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;padding:0;font-size:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.read{font-family:'Andika','Fredoka',sans-serif}
h1,h2,h3,h4{font-weight:700}

/* Boutons « 3D » */
.btn{--c:var(--v);--d:var(--vd);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;font-size:20px;line-height:1.15;border-radius:18px;padding:14px 18px;box-shadow:0 5px 0 var(--d);transition:transform .07s,box-shadow .07s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn.g{--c:var(--g);--d:var(--gd)}.btn.y{--c:var(--y);--d:var(--yd);color:#4a3200}.btn.b{--c:var(--b);--d:var(--bd)}
.btn.o{--c:var(--o);--d:var(--od)}.btn.r{--c:var(--r);--d:var(--rd)}.btn.p{--c:var(--p);--d:var(--pd)}
.btn.w{--c:#fff;--d:#D6DAEA;color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn.sm{font-size:16px;padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 var(--d)}
.btn[disabled]{filter:grayscale(.6) opacity(.55);pointer-events:none}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 4px 0 rgba(36,38,58,.08),0 10px 24px rgba(36,38,58,.06)}
.xbtn{width:46px;height:46px;border-radius:14px;background:#fff;font-size:22px;font-weight:700;color:var(--ink2);box-shadow:0 3px 0 #D6DAEA;flex:none}
.xbtn:active{transform:translateY(3px);box-shadow:0 0 0 #D6DAEA}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.07);white-space:nowrap}

/* Accueil */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.avm{width:68px;height:68px;flex:none;border-radius:50%;box-shadow:0 0 0 4px #fff,0 6px 12px rgba(0,0,0,.14)}
.avm svg,.gav svg,.bigav svg,.mav svg,.ith svg{width:100%;height:100%;display:block;overflow:visible}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hello{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvlrow{display:flex;align-items:center;gap:8px}
.lvlbadge{background:var(--v);color:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.xpbar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px;transition:width .6s}
.xpt{font-size:12px;color:var(--ink2);font-weight:500}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.week{display:flex;justify-content:space-between;gap:4px;margin-bottom:12px;padding:10px 12px}
.day{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink2)}
.day b{display:flex;align-items:center;justify-content:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:17px}
.day.done b{background:#FFE3BF}
.day.today b{box-shadow:0 0 0 3px var(--v)}
.day.miss b{background:#ECEEF6;color:var(--mut)}
.giftban{background:var(--p);color:#fff;border-radius:18px;padding:12px 14px;font-weight:600;margin-bottom:12px;box-shadow:0 5px 0 var(--pd);animation:pulse 1.6s infinite;cursor:pointer}
.mission{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mtx{flex:1}
.mission h3{margin:0 0 6px;font-size:16px;color:var(--ink2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:6px 9px;font-weight:600;font-size:15px}
.step.ok{background:#DCFCE7;color:#166534}
.chest{font-size:50px;line-height:1;flex:none;filter:grayscale(1) opacity(.45)}
.chest.ready{filter:none;animation:wiggle 1s infinite}
.chest.open{filter:none}
.play{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:14px;border-radius:24px;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d)}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.play .ico{font-size:40px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);border-radius:18px;flex:none}
.play .tx{flex:1;min-width:0}
.play .t1{display:block;font-size:26px;font-weight:700;line-height:1.1}
.play .t2{display:block;font-size:15px;font-weight:500;opacity:.95;margin-top:3px}
.play .t3{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px}
.play .mbar{display:block;height:10px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:8px;overflow:hidden}
.play .mbar i{display:block;height:100%;background:#fff;border-radius:99px}
.play.locked{filter:grayscale(.85);opacity:.7}
.play .lock{position:absolute;right:14px;top:12px;font-size:22px}
.play.pulse{animation:pulse 1.6s infinite}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mini{background:#fff;border-radius:20px;padding:12px 6px;box-shadow:0 5px 0 #D6DAEA;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini span{font-size:32px}
.mini:active{transform:translateY(4px);box-shadow:0 1px 0 #D6DAEA}
.parentbtn{display:block;margin:6px auto 0;color:var(--ink2);font-weight:600;font-size:15px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.6)}

/* Jeu */
.game{display:flex;flex-direction:column;position:relative}
.gtop{display:flex;align-items:center;gap:10px}
.gprog{flex:1;height:18px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.gprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),#7BE495);border-radius:99px;transition:width .4s}
.combo{min-width:66px;text-align:right;font-weight:700;font-size:20px;color:var(--od)}
.clock{flex:1;text-align:center;font-size:30px;font-weight:700}
.clock.hurry{color:var(--r);animation:pulse .5s infinite}
.gmid{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 10px}
.gav{width:74px;height:74px}
.gav.bounce{animation:bounce .5s}
.sscore{font-size:22px;font-weight:700;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.qcard{position:relative;background:#fff;border-radius:28px;padding:30px 14px 26px;text-align:center;box-shadow:0 6px 0 rgba(36,38,58,.1);margin-bottom:16px;min-height:clamp(180px,26vh,260px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.qcard.in{animation:qin .22s ease-out}
.q{font-size:clamp(44px,13vw,72px);font-weight:700;white-space:nowrap;line-height:1.2}
.slot{display:inline-block;min-width:1.25em;padding:0 .12em;border-radius:16px;background:var(--soft);color:var(--mut);border:4px dashed #D5D9EA;line-height:1.1;text-align:center}
.slot.filled{color:var(--ink);border-style:solid;border-color:var(--v);background:#F1EDFF}
.slot.ok{background:#DCFCE7;border:4px solid var(--g);color:var(--gd)}
.slot.ko{background:#FFE4E6;border:4px solid var(--r);color:var(--rd)}
.qcard.good{animation:goodflash .5s}
.qcard.shake{animation:shake .45s}
.tbar{position:absolute;left:20px;right:20px;bottom:11px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--y),var(--o));border-radius:99px}
.retry{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--y);color:#4a3200;font-weight:700;border-radius:999px;padding:4px 14px;font-size:15px;white-space:nowrap}
.retry.rev{background:#E0F2FE;color:#075985}
.praise{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:30px;font-weight:700;pointer-events:none;opacity:0;z-index:5;text-shadow:0 3px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.praise.good{color:var(--gd)}.praise.combo{color:var(--od)}
.praise.show{animation:praise .75s ease-out}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(56px,8.6vh,76px);border-radius:18px;background:#fff;font-size:34px;font-weight:700;box-shadow:0 5px 0 #D6DAEA;color:var(--ink)}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #D6DAEA}
.key.del{background:#FFF1F2;color:var(--rd);box-shadow:0 5px 0 #F5C2C7}
.key.ok{background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{--c:var(--b);--d:var(--bd);height:clamp(96px,15vh,128px);border-radius:24px;font-size:clamp(40px,11vw,54px);font-weight:700;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d)}
.choice:nth-child(2){--c:var(--o);--d:var(--od)}.choice:nth-child(3){--c:var(--p);--d:var(--pd)}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.choice.ok{--c:var(--g);--d:var(--gd);animation:pop .4s}
.choice.ko{--c:#9AA0B8;--d:#757B94;animation:shake .4s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opts.col{grid-template-columns:1fr}
.opt{min-height:100px;border-radius:22px;background:#fff;font-size:44px;font-weight:700;color:var(--ink);box-shadow:0 6px 0 #D6DAEA;border:4px solid transparent;padding:6px;line-height:1.1}
.opts.col .opt{min-height:72px;font-size:34px}
.opts.emo .opt{font-size:52px}
.opts.emo2 .opt{font-size:38px;letter-spacing:-2px}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 #D6DAEA}
.opt.ok{border-color:var(--g);background:#DCFCE7;animation:pop .35s}
.opt.ko{border-color:var(--r);background:#FFE4E6;animation:shake .4s}
.opt.right{border-color:var(--g);border-style:dashed}
.answers.veil{visibility:hidden}
.inst{font-size:18px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.word{font-size:clamp(44px,13vw,66px);font-weight:700;letter-spacing:1px}
.word.gone{color:var(--mut)}
.sentence{font-size:clamp(26px,7.5vw,36px);font-weight:700;line-height:1.3}
.speaker{width:86px;height:86px;border-radius:50%;background:var(--p);color:#fff;font-size:40px;box-shadow:0 6px 0 var(--pd);margin-top:4px}
.speaker:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pd)}
.count{font-size:110px;font-weight:700;color:var(--v)}

/* Correction */
.fix{position:fixed;inset:0;background:rgba(36,38,58,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.fixbox{background:#fff;border-radius:28px;padding:20px 16px;width:100%;max-width:480px;text-align:center;max-height:94vh;overflow:auto;animation:pop .3s}
.fixt{font-size:30px;font-weight:700;color:var(--rd)}
.fixs{color:var(--ink2);font-weight:600;margin:2px 0 6px;font-size:17px}
.fixm{font-size:clamp(40px,12vw,60px);font-weight:700;color:var(--gd);margin-bottom:12px;line-height:1.15}
.fixm .emo{font-size:1.15em}
.fixsub{font-size:22px;color:var(--ink2);margin-top:4px}
.aid{background:var(--soft);border-radius:18px;padding:10px;margin:0 0 14px}
.arow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:24px;font-weight:700}
.cnts{display:flex;flex-wrap:nowrap;justify-content:center;gap:2px;margin-top:6px}
.cnt{position:relative;display:flex;flex-direction:column;align-items:center;width:26px}
.cnt i{font-style:normal;font-size:22px;line-height:1.15}
.cnt small{font-size:12px;font-weight:700;color:var(--vd);min-height:14px}
.cnt.sep{margin-left:8px}
.cnt.gone i{opacity:.25}
.cnt.gone::after{content:'✕';position:absolute;top:0;left:0;right:0;text-align:center;font-size:22px;line-height:1.15;color:var(--r);font-weight:700}
.ten{display:grid;grid-template-columns:repeat(5,36px);gap:5px;justify-content:center;margin-top:4px}
.ten span{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.ten .f{background:var(--b)}
.ten .e{background:#fff;border:2px dashed var(--o);color:var(--od)}
.aidt{font-size:16px;color:var(--ink2);font-weight:600;margin-top:8px}
.grps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.grp{background:#fff;border-radius:10px;padding:4px 7px;font-size:15px;letter-spacing:1px;color:var(--b)}

/* Résultats */
.result{text-align:center;padding-top:8px}
.stars{display:flex;justify-content:center;gap:10px;font-size:62px;margin:6px 0}
.stars .st{transform:scale(0);animation:starIn .5s forwards}
.stars .st:not(.on){filter:grayscale(1) opacity(.25)}
.result h1{margin:4px 0 12px;font-size:32px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rtile{background:#fff;border-radius:18px;padding:12px 8px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.rtile b{display:block;font-size:28px}
.rtile span{font-size:14px;color:var(--ink2);font-weight:500}
.cmp{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;font-weight:600;font-size:17px}
.cmp small{font-weight:500;color:var(--ink2);font-size:14px}
.gains{display:flex;justify-content:center;gap:10px;margin:4px 0 18px}
.gains span{background:var(--y);color:#4a3200;border-radius:999px;padding:8px 16px;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--yd)}
.bigscore{font-size:100px;font-weight:700;line-height:1;color:var(--v)}
.rsub{font-size:18px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.newrec{display:inline-block;background:var(--r);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:20px;animation:pulse 1s infinite;margin:6px 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* Sous-pages */
.stop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.stop h2{margin:0;font-size:26px;flex:1}
.lead{color:var(--ink2);font-weight:500;margin:0 0 12px}
.bigav{width:min(60vw,230px);height:min(60vw,230px);margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(36,38,58,.18))}
.bigav.trying{animation:pulse 1.4s infinite}
.buybar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:12px;min-height:64px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.buybar span{color:var(--ink2);font-weight:600;text-align:right}
.buybar.muted{justify-content:center;color:var(--ink2);font-weight:600}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:14px;padding:8px 10px;font-size:13px;font-weight:600;box-shadow:0 3px 0 #D6DAEA;min-width:74px}
.cat span{font-size:24px}
.cat.on{background:var(--v);color:#fff;box-shadow:0 3px 0 var(--vd)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:#fff;border-radius:18px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #D6DAEA;border:3px solid transparent}
.item .ith{width:78px;height:78px}
.item .iname{font-size:14px;font-weight:600;line-height:1.1}
.item .iprice{font-size:13px;font-weight:700;color:var(--od)}
.item.eq{border-color:var(--g)}.item.eq .iprice{color:var(--gd)}
.item.sel{border-color:var(--v)}
.item.locked .ith{filter:grayscale(1) opacity(.45)}.item.locked .iprice{color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 0 #D6DAEA;display:flex;flex-direction:column;gap:3px;align-items:center}
.badge .be{font-size:40px;filter:grayscale(1);opacity:.3}
.badge.got .be{filter:none;opacity:1}
.badge b{font-size:14px;line-height:1.15}
.badge small{font-size:12px;color:var(--ink2);line-height:1.2}
.gcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 4px 0 #D6DAEA}
.gcard .ge{font-size:46px}
.gcard .gt{flex:1;display:flex;flex-direction:column;gap:3px}
.gcard small{color:var(--ink2);font-weight:500}
.gbar{display:block;height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--p);border-radius:99px}
.gcard.won{box-shadow:0 4px 0 var(--pd);border:3px solid var(--p)}
.gcard.given{opacity:.6}

/* Modale */
.modal{position:fixed;inset:0;background:rgba(36,38,58,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:28px;padding:22px 18px;width:100%;max-width:440px;text-align:center;max-height:92vh;overflow:auto;animation:pop .35s}
.mbox h2{margin:6px 0;font-size:28px}
.mbox p{color:var(--ink2);font-size:17px;margin:6px 0 14px;line-height:1.4}
.bigemoji{font-size:84px;line-height:1;animation:starIn .6s}
.bigemoji.sm{font-size:56px}
.mav{width:150px;height:150px;margin:6px auto}
.chestbig{font-size:120px;line-height:1;cursor:pointer;animation:wiggle .8s infinite;display:inline-block}
.unl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}
.ui{display:flex;flex-direction:column;align-items:center;width:84px;font-size:12px;font-weight:600}
.ui .ith{width:64px;height:64px}
.gainline{font-size:22px;font-weight:700;color:var(--od);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* Espace parents */
.pincard{text-align:center;margin-top:10px}
.pincard h2{margin:6px 0}
.pincard p{color:var(--ink2);margin:4px 0 12px}
.pindots{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}

function deepMerge(base,over){for(const k in over){const o=over[k],b=base[k];if(o&&typeof o==='object'&&!Array.isArray(o)&&b&&typeof b==='object'&&!Array.isArray(b))base[k]=deepMerge(b,o);else base[k]=o;}return base;}
let S;
function load(){try{const raw=localStorage.getItem(STORE_KEY);if(raw){const d=JSON.parse(raw);S=deepMerge(defaultState(),d);if(!d.frV){S.frV=2;S.fr={};S.settings.frLevel=1;S.frFlashMs=2000;}S.settings.frLevel=Math.min(Math.max(1,S.settings.frLevel),FR_LEVELS.length);S.settings.mathLevel=Math.min(Math.max(1,S.settings.mathLevel),MATH_LEVELS.length);return;}}catch(e){}S=defaultState();}

// ---------- Progression ----------
const needFor=L=>80+40*L;
function levelInfo(xp){let L=1,r=xp;while(r>=needFor(L)){r-=needFor(L);L++;}return {level:L,into:r,need:needFor(L),pct:r/needFor(L)};}
function curStreak(){const t=dayKey(),y=dayKey(addDays(new Date(),-1));return (S.streak.last===t||S.streak.last===y)?S.streak.cur:0;}
function updateStreak(d){if(S.streak.last===d)return;const y=dayKey(addDays(new Date(),-1));S.streak.cur=S.streak.last===y?S.streak.cur+1:1;S.streak.last=d;S.streak.best=Math.max(S.streak.best,S.streak.cur);}
const today=()=>S.days[dayKey()]||{};
const chestAvailable=()=>{const t=today();return !!t.math&&(!!t.fr||!S.settings.frOn)&&!t.chest;};
function recordStat(store,key,ok,ms,fast){const s=store[key]||(store[key]={n:0,ok:0,st:0,err:0,ms:0});s.n++;s.last=Date.now();s.lo=ok?1:0;if(ok){s.ok++;s.ms=s.ms?Math.round(s.ms*.6+ms*.4):Math.round(ms);if(fast)s.st=Math.min(s.st+1,5);}else{s.err++;s.st=0;s.le=Date.now();}}
function wOf(store,key){const s=store[key];if(!s||!s.n)return 3;let w=s.st>=3?.5:s.st===2?1.5:s.st===1?2.5:4;if(s.le&&Date.now()-s.le<3*864e5)w+=2;return w;}
const factStatus=s=>!s||!s.n?'new':s.st>=3?'ok':(s.st>=1||s.lo)?'mid':'weak';
function levelMastery(sub,lv){const keys=sub==='math'?mathFacts(lv).map(f=>f.key):FR_LEVELS[lv-1].items.map(x=>'f'+lv+':'+itemKey(x));const st=sub==='math'?S.facts:S.fr;let m=0;keys.forEach(k=>{const s=st[k];if(s&&s.st>=3)m++;});return keys.length?m/keys.length:0;}
function wPick(arr,w){let tot=0;const ws=arr.map(x=>{const v=w(x);tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
// File de questions : quelques calculs « focus » répétés 2 fois + révisions pondérées par la faiblesse
function buildQueue(items,n,wfn){
  const scored=items.map(it=>({it,s:wfn(it.key)*(.6+Math.random()*.8)})).sort((a,b)=>b.s-a.s);
  const focusN=Math.min(items.length,Math.max(2,Math.round(n/3)));
  let out=[];scored.slice(0,focusN).forEach(x=>out.push(x.it,x.it));
  let pool=scored.slice(focusN).map(x=>x.it);
  while(out.length<n){if(!pool.length)pool=items.slice();const p=wPick(pool,it=>wfn(it.key));out.push(p);pool.splice(pool.indexOf(p),1);}
  out=shuffle(out.slice(0,n));
  for(let i=1;i<out.length;i++){if(out[i].key===out[i-1].key){for(let j=i+1;j<out.length;j++){if(out[j].key!==out[i].key&&(j+1>=out.length||out[j+1].key!==out[i].key)&&out[j-1].key!==out[i].key){[out[i],out[j]]=[out[j],out[i]];break;}}}}
  return out;
}

// ---------- Son : vrais bruitages (Web Audio), synthèse en secours ----------
const Sound={ctx:null,buf:{},loaded:false,
  unlock(){try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();this.load();}catch(e){}},
  load(){if(this.loaded||!this.ctx)return;this.loaded=true;Object.entries(SFX_DATA).forEach(([k,b64])=>{try{const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);this.ctx.decodeAudioData(u8.buffer,b=>{this.buf[k]=b;},()=>{});}catch(e){}});},
  sample(k,when,vol){const b=this.buf[k];if(!b)return false;try{const s=this.ctx.createBufferSource(),g=this.ctx.createGain();g.gain.value=vol||.7;s.buffer=b;s.connect(g);g.connect(this.ctx.destination);s.start(this.ctx.currentTime+(when||0));return true;}catch(e){return false;}},
  tone(f,t0,dur,type,vol,f2){const c=this.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05);},
  play(n){if(!S||!S.settings.sound)return;this.unlock();if(!this.ctx)return;
    if(n==='chest'){if(this.sample('unlock')){this.sample('reward',.35);return;}}else if(this.sample(n,0,n==='bad'?.5:n==='tap'?.45:.7))return;
    const T=(...a)=>this.tone(...a);
    switch(n){
      case 'good':T(660,0,.12,'triangle',.2);T(880,.08,.16,'triangle',.2);break;
      case 'fast':T(784,0,.1,'triangle',.18);T(1047,.07,.1,'triangle',.18);T(1319,.14,.18,'triangle',.18);break;
      case 'bad':T(240,0,.32,'sawtooth',.1,120);T(180,.04,.34,'square',.04,90);break;
      case 'coin':T(988,0,.08,'square',.07);T(1319,.07,.18,'square',.07);break;
      case 'tap':T(560,0,.05,'triangle',.07);break;
      case 'tick':T(1000,0,.05,'square',.04);break;
      case 'combo':[523,659,784,1047].forEach((f,i)=>T(f,i*.06,.14,'triangle',.16));break;
      case 'level':[523,659,784,1047,784,1047,1319].forEach((f,i)=>T(f,i*.11,.22,'triangle',.2));break;
      case 'badge':[880,1175,1568].forEach((f,i)=>T(f,i*.09,.3,'sine',.2));break;
      case 'chest':T(300,0,.25,'sawtooth',.05,600);[784,988,1175,1568].forEach((f,i)=>T(f,.25+i*.08,.25,'triangle',.18));break;
      case 'end':[659,784,880,1047].forEach((f,i)=>T(f,i*.12,.25,'triangle',.18));break;
      case 'go':[523,784,1047].forEach((f,i)=>T(f,i*.07,.18,'triangle',.18));break;
    }}
};

// ---------- Voix (synthèse vocale du navigateur) ----------
const Voice={v:null,ok:'speechSynthesis' in window,warm:false,t:0,cur:null,
  init(){if(!this.ok)return;const pv=()=>{const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));this.v=vs.find(v=>/fr[-_]FR/i.test(v.lang)&&/google|amélie|amelie|audrey|thomas|marie|hortense|denise|julie/i.test(v.name))||vs.find(v=>/fr[-_]FR/i.test(v.lang))||vs[0]||null;};pv();try{speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',pv):(speechSynthesis.onvoiceschanged=pv);}catch(e){}},
  unlock(){Rec.unlock();if(!this.ok||this.warm)return;this.warm=true;try{const u=new SpeechSynthesisUtterance(' ');u.lang='fr-FR';u.volume=0;speechSynthesis.speak(u);}catch(e){}},
  busy(){try{return this.ok&&(speechSynthesis.speaking||speechSynthesis.pending);}catch(e){return false;}},
  speak(text,o){if(!this.ok||!text)return;o=o||{};try{const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';if(this.v)u.voice=this.v;u.rate=o.rate||.9;u.pitch=1.05;u.volume=1;this.cur=u;if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}},
  hush(){clearTimeout(this.t);try{if(this.busy())speechSynthesis.cancel();}catch(e){}},
  // Annuler puis parler immédiatement fait taire certains navigateurs : on laisse 90 ms entre les deux
  say(text,o){Chain.stop();Rec.stopPlay();if(!this.ok||!text)return;const b=this.busy();this.hush();if(b)this.t=setTimeout(()=>this.speak(text,o),90);else this.speak(text,o);},
  stop(){Chain.stop();this.hush();Rec.stopPlay();},
  label(){if(!this.ok)return '❌ Voix non disponible sur ce navigateur';return this.v?`✅ Voix : ${this.v.name}`:'⚠️ Pas de voix française trouvée';}
};
const estMs=(t,r)=>Math.round((320+String(t).length*72)/(r||.9));
// Enchaîne voix, sons enregistrés et effets visuels (ex. « s… e… se »)
const Chain={t:[],
  run(steps,done){Voice.stop();let at=Voice.busy()?120:30;const add=(fn,d)=>this.t.push(setTimeout(fn,d));
    (steps||[]).forEach(st=>{if(!st)return;if(st.fn)add(st.fn,at);else if(st.say){const tx=st.say,r=st.rate;add(()=>Voice.speak(tx,{rate:r}),at);at+=estMs(tx,r);}else if(st.rec){const k=st.rec;add(()=>Rec.play(k),at);at+=1050;}else if(st.wait)at+=st.wait;});
    if(done)add(done,at);return at;},
  stop(){this.t.forEach(clearTimeout);this.t=[];}
};
// Sons enregistrés par les parents (stockés sur l'appareil)
const Rec={key:'supercerveau_sons',map:{},el:null,unlocked:false,rec:null,
  load(){try{this.map=JSON.parse(localStorage.getItem(this.key)||'{}')||{};}catch(e){this.map={};}},
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.map));return true;}catch(e){toast('Mémoire pleine : son non enregistré');return false;}},
  has(k){return !!(this.map[k]&&this.map[k].d);},
  unlock(){if(this.unlocked)return;this.unlocked=true;try{this.el=new Audio();this.el.setAttribute('playsinline','');this.el.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';const p=this.el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}},
  play(k){const r=this.map[k];if(!r)return;try{if(!this.el)this.el=new Audio();this.el.src=r.d;const p=this.el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}},
  stopPlay(){try{if(this.el&&!this.el.paused)this.el.pause();}catch(e){}},
  async record(k,cb){
    if(this.rec)return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Enregistrement impossible sur ce navigateur');return;}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Micro refusé : autorisez le micro pour ce site');return;}
    const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'],mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);}catch(e){mr=new MediaRecorder(stream);}
    const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});const fr=new FileReader();fr.onload=()=>{this.map[k]={d:fr.result,ms:1600};this.rec=null;if(this.save()){toast(`Son « ${k} » enregistré ✅`);this.play(k);}if(cb)cb();};fr.readAsDataURL(blob);};
    this.rec={k};mr.start();if(cb)cb();setTimeout(()=>{if(mr.state==='recording')mr.stop();},1600);
  },
  del(k){delete this.map[k];this.save();}
};

// ---------- Effets visuels ----------
const Confetti={cv:null,cx:null,p:[],on:false,
  init(){this.cv=$('#confetti');this.cx=this.cv.getContext('2d');const rs=()=>{const r=window.devicePixelRatio||1;this.cv.width=innerWidth*r;this.cv.height=innerHeight*r;this.cx.setTransform(r,0,0,r,0,0);};rs();addEventListener('resize',rs);},
  burst(n,x,y){n=n||100;x=x==null?innerWidth/2:x;y=y==null?innerHeight*.35:y;if(matchMedia('(prefers-reduced-motion: reduce)').matches)n=Math.min(n,20);const cols=['#FF5A64','#FFC83D','#22C55E','#2EA3FF','#7B5CFF','#FF6FB5','#FF9A1F'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*9;this.p.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,w:6+Math.random()*6,h:8+Math.random()*8,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0,max:80+Math.random()*60});}if(!this.on){this.on=true;requestAnimationFrame(()=>this.tick());}},
  tick(){const cx=this.cx;cx.clearRect(0,0,innerWidth,innerHeight);this.p=this.p.filter(q=>q.life<q.max&&q.y<innerHeight+40);for(const q of this.p){q.life++;q.vy+=.28;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;cx.save();cx.translate(q.x,q.y);cx.rotate(q.r);cx.globalAlpha=Math.max(0,1-q.life/q.max);cx.fillStyle=q.c;cx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cx.restore();}if(this.p.length)requestAnimationFrame(()=>this.tick());else{this.on=false;cx.clearRect(0,0,innerWidth,innerHeight);}}
};
function floatText(txt,el){if(!el)return;const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top-6)+'px';$('#fx').appendChild(d);setTimeout(()=>d.remove(),950);}
function praise(txt,cls){const p=$('#praise');if(!p)return;p.textContent=txt;p.className='praise '+(cls||'good');void p.offsetWidth;p.classList.add('show');}
function restart(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}
function showTip(el){const t=$('#tip');t.textContent=el.dataset?el.dataset.tip:el.getAttribute('data-tip');t.classList.remove('hidden');const r=el.getBoundingClientRect(),tw=t.offsetWidth;let x=r.left+r.width/2-tw/2;x=Math.max(8,Math.min(innerWidth-tw-8,x));t.style.left=x+'px';t.style.top=Math.max(8,r.top-t.offsetHeight-8)+'px';clearTimeout(showTip.h);showTip.h=setTimeout(()=>t.classList.add('hidden'),2600);}

// ---------- Aide visuelle après une erreur ----------
const OBJ=['🍎','🍓','⭐','🐟','🍪','⚽','🚗','🦆','🌸','🍩','🎈','🐞'];
function aidHTML(f){
  if(!S.settings.aid)return '';
  const i1=(f.a*7+f.b*3)%OBJ.length;let i2=(i1+3+f.b)%OBJ.length;if(i2===i1)i2=(i1+1)%OBJ.length;const o1=OBJ[i1],o2=OBJ[i2];
  const cnt=arr=>{let h='';for(let r=0;r<arr.length;r+=10)h+=`<div class="cnts">${arr.slice(r,r+10).map((x,i)=>`<span class="cnt ${x.g?'gone':''} ${i===5?'sep':''}"><i>${x.e}</i><small>${x.n||''}</small></span>`).join('')}</div>`;return h;};
  const diz=n=>n>1?'dizaines':'dizaine';
  if((f.op==='+'||f.op==='-')&&f.a%10===0&&f.b%10===0&&f.a>=20){const ta=f.a/10,tb=f.b/10;return `<div class="aid"><div class="arow"><span>${'🔟'.repeat(ta)}</span><span>${OPS[f.op]}</span><span>${'🔟'.repeat(tb)}</span></div><div class="aidt">${ta} ${diz(ta)} ${OPW[f.op]} ${tb} ${diz(tb)} = ${f.ans/10} ${diz(f.ans/10)} = ${f.ans}</div></div>`;}
  if(f.op==='+'&&f.ans<=20){const arr=[];for(let i=0;i<f.a;i++)arr.push({e:o1});for(let i=0;i<f.b;i++)arr.push({e:o2});arr.forEach((x,i)=>x.n=i+1);return `<div class="aid"><div class="arow"><span>${f.a} ${o1}</span><span>+</span><span>${f.b} ${o2}</span></div>${cnt(arr)}<div class="aidt">On compte tout : ${f.ans} !</div></div>`;}
  if(f.op==='-'&&f.a<=20){const arr=[];let n=0;for(let i=0;i<f.a;i++){const gone=i>=f.a-f.b;arr.push({e:o1,g:gone,n:gone?'':++n});}return `<div class="aid"><div class="arow"><span>${f.a} ${o1}</span><span>−</span><span>${f.b} ✕</span></div>${cnt(arr)}<div class="aidt">On en enlève ${f.b}, il en reste ${f.ans} !</div></div>`;}
  if(f.op==='c'){let c='';for(let i=0;i<10;i++)c+=i<f.a?'<span class="f"></span>':`<span class="e">${i-f.a+1}</span>`;return `<div class="aid"><div class="ten">${c}</div><div class="aidt">${f.a} cases pleines. Il en manque ${f.ans} pour faire 10 !</div></div>`;}
  if(f.op==='x'&&f.ans<=50)return `<div class="aid"><div class="grps">${Array.from({length:f.a},()=>`<span class="grp">${'●'.repeat(f.b)}</span>`).join('')}</div><div class="aidt">${f.a} paquets de ${f.b} = ${f.ans}</div></div>`;
  return '';
}

// ---------- Moteur de jeu ----------
let G=null;
function later(fn,ms){const g=G;if(!g)return;const t=setTimeout(()=>{if(G===g&&!g.ended)fn();},ms);g.timers.push(t);}
function stopGame(){if(G){G.ended=true;G.timers.forEach(clearTimeout);if(G.clock)clearInterval(G.clock);}G=null;Voice.stop();$('#tip').classList.add('hidden');}
function startGame(sub,mode){
  stopGame();const st=S.settings;
  G={sub,mode,queue:[],idx:0,n:0,mainN:0,okFirst:0,combo:0,bestCombo:0,fast:0,times:[],xp:0,coins:0,wrong:0,score:0,t0:Date.now(),reviews:{},timers:[],cur:null,input:'',ended:false};
  if(sub==='math'){
    G.facts=mathFacts(st.mathLevel);
    if(mode==='train')G.queue=buildQueue(G.facts.map(f=>({key:f.key,f})),st.nQ,k=>wOf(S.facts,k)).map(it=>({kind:'main',it}));
  }else{
    const L=FR_LEVELS[st.frLevel-1];
    G.queue=buildQueue(L.items.map(x=>({key:'f'+st.frLevel+':'+itemKey(x),f:x})),st.frNQ,k=>wOf(S.fr,k)).map(it=>({kind:'main',it}));
  }
  G.maxLen=G.queue.length*2+4;
  go('game');
  if(mode==='sprint')sprintCountdown();else nextQ();
}
function nextQ(){
  if(!G||G.ended)return;let qi;
  if(G.mode==='sprint'){
    if(Date.now()>=G.endAt)return endGame();
    let f,tries=0;do{f=wPick(G.facts,x=>{const s=S.facts[x.key];return s&&s.st>=1?3:1.2;});tries++;}while(f.key===G.lastKey&&G.facts.length>1&&tries<10);
    G.lastKey=f.key;qi={kind:'sprint',it:{key:f.key,f}};
  }else{
    if(G.idx>=G.queue.length)return endGame();
    qi=G.queue[G.idx];
  }
  const q=G.sub==='math'?mathQ(qi.it.f):frQ(S.settings.frLevel,qi.it.f);
  G.cur={qi,q,start:performance.now(),done:false};G.input='';
  drawQ();
}
const keypadHTML=(act)=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="key" data-act="${act}" data-arg="${d}">${d}</button>`).join('')}<button class="key del" data-act="${act}" data-arg="del" aria-label="Effacer">⌫</button><button class="key" data-act="${act}" data-arg="0">0</button>${act==='key'?`<button class="key ok" data-act="${act}" data-arg="ok" aria-label="Valider">✓</button>`:'<span></span>'}</div>`;
function drawQ(){
  const {q,qi}=G.cur,card=$('#qcard'),ans=$('#answers');if(!card)return;
  let h=qi.kind==='retry'?'<div class="retry">À toi ! 💪</div>':qi.kind==='review'?'<div class="retry rev">On revoit 🔁</div>':'';
  if(q.type==='math'){h+=`<div class="q">${fQ(q.f,'<span class="slot" id="slot">?</span>')}</div>`;if(G.mode!=='sprint')h+='<div class="tbar"><i id="tbar"></i></div>';}
  else{
    h+=`<div class="inst">${q.inst}</div>`;
    if(q.type==='fuse')h+=`<div class="fuse" id="fuse"><span class="tile c read">${q.c}</span><span class="op">+</span><span class="tile v read">${q.v}</span><span class="op">=</span><span class="tile qm">?</span></div>`;
    else if(q.type==='first')h+=`<div class="bigemo">${q.show}</div>`;
    else if(q.type==='flash')h+=`<div id="flashw">${sylHTML(q.word.sy)}</div>`;
    else if(q.type==='wread')h+=sylHTML(q.word.sy)+'<button class="helpbtn" data-act="sylhelp">👂 Aide : syllabe par syllabe</button>';
    else if(q.type==='sent')h+=`<div class="sentence read">${esc(q.show)}</div>`;
    if(q.say||q.chain)h+='<button class="speaker" data-act="replay" aria-label="Réécouter">🔊</button>';
    if(!Voice.ok&&(q.say||q.chain))h+='<div class="nosound">🔇 Ce navigateur ne sait pas parler. Ouvrez l’appli dans Safari ou Chrome.</div>';
  }
  card.className='qcard';card.innerHTML=h;restart(card,'in');
  if(q.type==='math')ans.innerHTML=S.settings.mode==='keys'?keypadHTML('key'):`<div class="choices">${q.choices.map(v=>`<button class="choice" data-act="choose" data-arg="${v}">${v}</button>`).join('')}</div>`;
  else ans.innerHTML=`<div class="opts ${q.optCls}">${q.opts.map(o=>`<button class="opt" data-act="pickopt" data-arg="${esc(o.v)}">${o.h||esc(o.l)}</button>`).join('')}</div>`;
  ans.className='answers';
  if(G.mode!=='sprint'){const p=$('#gprog');if(p)p.style.width=Math.round(G.idx/G.queue.length*100)+'%';}
  const tb=$('#tbar');if(tb){const T=S.settings.target*1000;tb.style.transition='none';tb.style.width='100%';void tb.offsetWidth;tb.style.transition=`width ${T}ms linear`;tb.style.width='0%';}
  if(q.type!=='math'){
    const first=G.idx===0&&qi.kind==='main',steps=(q.chain||(q.say?[{say:q.say,rate:q.type==='syll'?.8:.88}]:[])).filter(Boolean);
    if(first)steps.unshift({say:q.inst.replace('… ⚡','')});
    if(steps.length)Chain.run(steps);
  }else if(S.settings.voiceQ&&G.mode!=='sprint')Voice.say(q.say);
  if(q.type==='flash'){
    ans.classList.add('veil');const ms=S.frFlashMs+(qi.kind==='retry'?600:0);
    later(()=>{const w=$('#flashw');if(w)w.innerHTML='<span class="word gone">❓</span>';ans.classList.remove('veil');if(G.cur)G.cur.start=performance.now();},ms);
  }
}
function updateHud(){const c=$('#combo');if(c)c.textContent=G.combo>=2?`🔥 x${G.combo}`:'';const ss=$('#sscore');if(ss)ss.textContent=G.mode==='sprint'?`✅ ${G.score}`:`🪙 ${G.coins}`;}
function markAnswer(val,ok){
  const q=G.cur.q;
  if(q.type==='math'){const s=$('#slot');if(s){s.textContent=val;s.className='slot '+(ok?'ok':'ko');}$$('.choice').forEach(b=>{if(b.dataset.arg===String(val))b.classList.add(ok?'ok':'ko');});}
  else $$('.opt').forEach(b=>{if(b.dataset.arg===String(val))b.classList.add(ok?'ok':'ko');else if(!ok&&b.dataset.arg===String(q.ans))b.classList.add('right');});
  if(ok)restart($('#qcard'),'good');else restart($('#qcard'),'shake');
  const tb=$('#tbar');if(tb){const w=getComputedStyle(tb).width;tb.style.transition='none';tb.style.width=w;}
}
function submit(val){
  const c=G&&G.cur;if(!c||c.done)return;c.done=true;
  const ms=performance.now()-c.start,ok=String(val)===String(c.q.ans);
  const fast=ok&&!c.helped&&ms<=(G.sub==='math'?S.settings.target*1000:5000);
  const kind=c.qi.kind,store=G.sub==='math'?S.facts:S.fr;
  markAnswer(val,ok);
  if(G.mode==='sprint')return sprintAnswer(ok,ms,fast,c);
  if(kind==='retry'){
    if(ok){Sound.play('good');praise('Bien corrigé ! 👍');G.xp+=3;bounceAv();reinforce(c.q);G.idx++;later(nextQ,c.q.afterDelay||900);}
    else{Sound.play('bad');const tries=(c.qi.tries||1)+1;if(tries<=3)G.queue.splice(G.idx+1,0,{kind:'retry',it:c.qi.it,tries});later(()=>showFix(c.q,()=>{G.idx++;nextQ();}),500);}
    return;
  }
  recordStat(store,c.q.key,ok,ms,fast);
  if(c.q.type==='flash')S.frFlashMs=ok?Math.max(500,S.frFlashMs-100):Math.min(3000,S.frFlashMs+250);
  G.n++;S.stats.n++;if(kind==='main'){G.mainN++;if(ok)G.okFirst++;}
  if(ok){
    S.stats.ok++;S.stats.ms+=ms;G.times.push(ms);G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);
    let xp=10,coins=1;if(fast){xp+=5;coins+=1;if(kind==='main')G.fast++;}
    G.xp+=xp;G.coins+=coins;
    Sound.play(fast?'fast':'good');praise(fast?'⚡ Rapide !':pick(PRAISE));
    floatText(`+${coins} 🪙`,$('#sscore'));bounceAv();
    if(G.combo%5===0){G.xp+=10;G.coins+=2;later(()=>{Sound.play('combo');praise(`🔥 Combo x${G.combo} !`,'combo');},380);}
    updateHud();
    reinforce(c.q);
    G.idx++;later(nextQ,c.q.afterDelay||(c.q.afterSay?1000:fast?600:800));
  }else{
    G.combo=0;G.wrong++;Sound.play('bad');updateHud();
    G.queue.splice(G.idx+1,0,{kind:'retry',it:c.qi.it,tries:1});
    const rk=c.q.key;G.reviews[rk]=G.reviews[rk]||0;
    if(G.reviews[rk]<2&&G.queue.length<G.maxLen){G.queue.splice(Math.min(G.idx+5,G.queue.length),0,{kind:'review',it:c.qi.it});G.queue.push({kind:'review',it:c.qi.it});G.reviews[rk]+=2;}
    later(()=>showFix(c.q,()=>{G.idx++;nextQ();}),550);
  }
}
function bounceAv(){restart($('#gav'),'bounce');}
// Après une bonne réponse en lecture : on montre et on dit le mot / la syllabe
function reinforce(q){
  if(q.type==='fuse'){const f=$('#fuse');if(f)f.innerHTML=`<span class="tile merged read">${q.ans}</span>`;}
  if(q.type==='flash'){const w=$('#flashw');if(w)w.innerHTML=sylHTML(q.word.sy);}
  if(q.afterAnim){const w=$('#qcard .sylw');if(w)restart(w,'anim');}
  if(q.afterSay)Voice.say(q.afterSay);
}
function showFix(q,cont){
  const fx=$('#fix');if(!fx)return cont();
  fx.innerHTML=`<div class="fixbox"><div class="fixt">${pick(OOPS)}</div><div class="fixs">La bonne réponse :</div><div class="fixm">${q.fixHTML}</div>${q.type==='math'?aidHTML(q.f):''}<button class="btn g block" id="fixok" data-act="fixok" disabled>J’ai compris 👍</button></div>`;
  fx.classList.remove('hidden');G.fixCont=cont;
  if(q.fixChain)Chain.run(q.fixChain);else if(G.sub==='fr'||S.settings.voice)Voice.say(q.fixSay,{rate:.85});
  later(()=>{const b=$('#fixok');if(b)b.disabled=false;},900);
}
function sprintCountdown(){
  const card=$('#qcard');let n=3;$('#answers').innerHTML='';
  const step=()=>{if(!G||G.ended)return;
    if(n>0){card.innerHTML=`<div class="count">${n}</div>`;restart(card,'in');Sound.play('tick');n--;later(step,700);}
    else{card.innerHTML='<div class="count">Go ! 🚀</div>';Sound.play('go');later(()=>{G.endAt=Date.now()+S.settings.sprintSec*1000;G.clock=setInterval(sprintTick,200);sprintTick();nextQ();},450);}};
  step();
}
function sprintTick(){if(!G||G.ended)return;const left=Math.max(0,Math.ceil((G.endAt-Date.now())/1000)),el=$('#clock');if(el){el.textContent='⏱ '+left;el.classList.toggle('hurry',left<=10);}if(left<=0){clearInterval(G.clock);if(G.cur)G.cur.done=true;endGame();}}
function sprintAnswer(ok,ms,fast,c){
  recordStat(S.facts,c.q.key,ok,ms,fast);S.stats.n++;
  if(ok){S.stats.ok++;S.stats.ms+=ms;G.score++;G.times.push(ms);G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);G.xp+=5;G.coins+=1;Sound.play(fast?'fast':'good');updateHud();if(G.combo%5===0)praise(`🔥 x${G.combo}`,'combo');later(nextQ,260);}
  else{G.combo=0;G.wrong++;Sound.play('bad');updateHud();later(()=>{const s=$('#slot');if(s){s.textContent=c.q.ans;s.className='slot ok';}},380);later(nextQ,1150);}
}
function endGame(){
  if(!G||G.ended)return;G.ended=true;G.timers.forEach(clearTimeout);if(G.clock)clearInterval(G.clock);Voice.stop();
  const day=dayKey(),avgMs=G.times.length?Math.round(G.times.reduce((a,b)=>a+b,0)/G.times.length):0,dur=Math.round((Date.now()-G.t0)/1000);
  const before=levelInfo(S.xp).level;let sess;
  if(G.mode==='sprint'){
    const lv=S.settings.mathLevel,best=S.stats.sprintBest[lv]||0;G.prevBest=best;G.record=G.score>best;
    if(G.record){S.stats.sprintBest[lv]=G.score;G.coins+=15;G.xp+=20;}
    sess={t:Date.now(),d:day,type:'sprint',lvl:lv,score:G.score,sec:S.settings.sprintSec,wrong:G.wrong,avgMs,xp:G.xp,coins:G.coins,dur:S.settings.sprintSec};
  }else{
    const acc=G.mainN?G.okFirst/G.mainN:0;G.stars=acc>=.9?3:acc>=.7?2:1;
    G.xp+=20;G.coins+=[0,5,10,20][G.stars];
    const prev=S.sessions.slice().reverse().find(s=>s.type===G.sub&&s.avgMs);G.prevAvg=prev?prev.avgMs:0;
    sess={t:Date.now(),d:day,type:G.sub,lvl:G.sub==='math'?S.settings.mathLevel:S.settings.frLevel,n:G.mainN,ok:G.okFirst,avgMs,fast:G.fast,combo:G.bestCombo,stars:G.stars,xp:G.xp,coins:G.coins,dur};
    if(G.sub==='fr')sess.flash=S.frFlashMs;
    S.days[day]=S.days[day]||{};S.days[day][G.sub]=true;updateStreak(day);
  }
  S.sessions.push(sess);if(S.sessions.length>800)S.sessions.splice(0,S.sessions.length-800);
  S.stats.bestCombo=Math.max(S.stats.bestCombo,G.bestCombo);S.xp+=G.xp;S.coins+=G.coins;G.sess=sess;save();
  const after=levelInfo(S.xp).level,badges=checkBadges(sess),gifts=checkGifts();
  go('result');Sound.play('end');
  if(G.mode==='sprint'?G.record:G.stars>=2)setTimeout(()=>Confetti.burst(130),250);
  if(S.settings.voice){const nmv=S.name||'';Voice.say(G.mode==='sprint'?`${G.score} calculs justes ! ${G.record?'Nouveau record !':''}`:`Bravo ${nmv} ! ${G.stars} étoile${G.stars>1?'s':''} !`);}
  setTimeout(()=>{if(after>before)levelUpModal(before,after);badges.forEach(badgeModal);gifts.forEach(giftModal);},1300);
}

function aggDays(list){const m={};list.forEach(s=>{const x=m[s.d]||(m[s.d]={d:s.d,n:0,ok:0,t:0,tn:0});x.n+=s.n||0;x.ok+=s.ok||0;if(s.avgMs){x.t+=s.avgMs*(s.ok||1);x.tn+=(s.ok||1);}});return Object.values(m).sort((a,b)=>a.d<b.d?-1:1).slice(-30).map(x=>({d:x.d,acc:x.n?x.ok/x.n:0,avg:x.tn?x.t/x.tn:0}));}
function lineChart(pts,o){
  if(!pts.length)return '<div class="empty">Pas encore de données : la courbe apparaîtra après les premières parties.</div>';
  const W=340,H=170,L=44,R=14,T=18,B=24,iw=W-L-R,ih=H-T-B,y0=o.yMin||0,y1=o.yMax;
  const X=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>T+ih-(Math.min(Math.max(v,y0),y1)-y0)/(y1-y0)*ih;
  let g='';[0,.5,1].forEach(f=>{const v=y0+(y1-y0)*f,y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E7E9F3" stroke-width="1"/><text x="${L-6}" y="${+y+4}" text-anchor="end" class="ax">${o.fmt(v)}</text>`;});
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="${o.color}" stroke="#fff" stroke-width="2"/>`).join('');
  const hits=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="14" fill="transparent" data-tip="${esc((p.tip||p.lab)+' : '+o.fmt(p.y))}"/>`).join('');
  const last=pts[pts.length-1],lx=X(pts.length-1),ly=Math.max(12,Y(last.y)-10);
  const xl=`<text x="${X(0).toFixed(1)}" y="${H-5}" text-anchor="${pts.length===1?'middle':'start'}" class="ax">${esc(pts[0].lab)}</text>`+(pts.length>1?`<text x="${lx.toFixed(1)}" y="${H-5}" text-anchor="end" class="ax">${esc(last.lab)}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||'')}">${g}${pts.length>1?`<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}<text x="${Math.min(lx+4,W-2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end" class="vl">${o.fmt(last.y)}</text>${xl}${hits}</svg>`;
}
function factMap(lv){
  const facts=mathFacts(lv);let list=facts,note='';
  if(facts.length>120){list=facts.filter(f=>S.facts[f.key]&&S.facts[f.key].n);note=`<p class="hint">${facts.length} calculs dans ce niveau : seuls ceux déjà vus sont affichés.</p>`;}
  if(!list.length)return note+'<div class="empty">Aucun calcul vu pour l’instant.</div>';
  return note+`<div class="chips">${list.map(f=>{const s=S.facts[f.key],tip=s&&s.n?`${fFull(f)} · vu ${s.n} fois · ${s.ok} juste${s.ok>1?'s':''}${s.ms?' · '+sec(s.ms):''}`:`${fFull(f)} · pas encore vu`;return `<span class="chip ${factStatus(s)}" data-tip="${esc(tip)}">${esc(fShort(f))}</span>`;}).join('')}</div>`;
}
function weakList(){
  const m=new Map();MATH_LEVELS.forEach((L,i)=>mathFacts(i+1).forEach(f=>{const s=S.facts[f.key];if(s&&s.err&&s.st<3&&!m.has(f.key))m.set(f.key,{f,s});}));
  const arr=[...m.values()].sort((a,b)=>(b.s.err-b.s.ok*.3)-(a.s.err-a.s.ok*.3)).slice(0,8);
  if(!arr.length)return '<div class="empty">Rien à signaler 👍</div>';
  return arr.map(({f,s})=>`<div class="weak"><span class="chip weak">${esc(fShort(f))}</span><span>${s.err} erreur${s.err>1?'s':''} · ${s.ok} juste${s.ok>1?'s':''}${s.ms?' · '+sec(s.ms):''}</span></div>`).join('');
}

document.addEventListener('click',e=>{
  const tipEl=e.target.closest&&e.target.closest('[data-tip]');if(tipEl)showTip(tipEl);
  const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.getAttribute('data-act')];if(fn)fn(el.getAttribute('data-arg'),el,e);
});
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('input',e=>{const el=e.target;if(el.getAttribute&&el.getAttribute('data-field')==='name'){S.name=el.value.trim().slice(0,20);save();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='importFile'&&el.files&&el.files[0]){importFile(el.files[0]);el.value='';}});
document.addEventListener('keydown',e=>{
  if(SCR==='game'&&G&&G.cur&&!G.cur.done&&!modalOpen&&$('#fix').classList.contains('hidden')){
    if(G.cur.q.type==='math'&&S.settings.mode==='keys'){if(/^[0-9]$/.test(e.key))ACT.key(e.key);else if(e.key==='Backspace')ACT.key('del');else if(e.key==='Enter')ACT.key('ok');}
    else{const n=parseInt(e.key,10);const b=$$('#answers button')[n-1];if(b&&n>=1)b.click();}
  }else if(SCR==='pin'&&/^[0-9]$/.test(e.key))ACT.pin(e.key);
});

// ---------- Démarrage ----------
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
Rec.load();load();Voice.init();Confetti.init();render();
if(!S.welcomed){S.welcomed=true;save();queueModal(`<div class="mav">${avatarSVG(S.avatar)}</div><h2>Salut ${nm()} ! 👋</h2><p>Chaque jour :<br><b>1.</b> Entraîne-toi en maths 🔢<br><b>2.</b> Fais ta lecture 📖<br><b>3.</b> Ouvre ton coffre 🎁</p><p>Gagne des pièces 🪙 pour habiller ton personnage et débloquer des surprises !</p><button class="btn g block" data-act="mclose">C’est parti ! 🚀</button>`);}
else checkGifts().forEach(giftModal);
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7B5CFF">
<title>Aide · Malino</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Fredoka","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;color:#2b2160;
  background:radial-gradient(700px 500px at 15% 0%,#B9A5FF 0%,transparent 60%),linear-gradient(160deg,#7B5CFF,#4A36E0);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.card{background:#fff;border-radius:26px;padding:24px 22px 20px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 8px 0 #D9D0FF,0 24px 40px rgba(20,8,90,.35)}
.card img{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 14px rgba(40,20,140,.3)}
h1{font-size:26px;margin:10px 0 6px}
p{font-size:17px;line-height:1.4;color:#4b4180}
.step{margin:14px 0 4px;background:#FFF3C9;border-radius:16px;padding:12px 14px;font-weight:600;color:#6a4a00}
.back{display:inline-block;margin-top:14px;color:#6B4DF5;font-weight:600;text-decoration:none;font-size:15px}
.arrow{position:fixed;right:78px;bottom:96px;width:120px;height:120px;pointer-events:none;z-index:2147483000;
  animation:pt 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
@keyframes pt{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,10px)}}
@media(max-width:480px){.arrow{right:62px;bottom:82px;width:96px;height:96px}}
</style>
</head>
<body>
<main class="card">
  <img src="logo.svg" alt="Malino">
  <h1>Besoin d’aide ?</h1>
  <p>On est là pour t’aider ! Pour parler avec le support de Malino :</p>
  <div class="step">👉 Clique sur la bulle de discussion en bas à droite de l’écran</div>
  <a class="back" href="./">← Retour à Malino</a>
  <p style="font-size:11px;margin-top:12px;color:#9a93c8">Voix : Piper TTS, voix « siwis » (SIWIS, Univ. d’Édimbourg, CC BY 4.0)</p>
</main>

<svg class="arrow" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M14 20 C 20 70, 55 95, 92 96" fill="none" stroke="#FFE17A" stroke-width="12" stroke-linecap="round"/>
  <path d="M70 70 L100 98 L64 112" fill="none" stroke="#FFE17A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<script src="https://code.tidio.co/jub5k7agyx478c0qfw044g3bepaackg7.js" async></script>
</body>
</html>
